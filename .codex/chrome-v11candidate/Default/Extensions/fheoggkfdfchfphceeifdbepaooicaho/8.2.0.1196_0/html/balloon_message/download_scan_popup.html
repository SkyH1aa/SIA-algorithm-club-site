<div class="dls__container">
  <div class="shield">
    <div class="shield__circle">
      <img id="dls_ballon_icon" x-mcsrc src="images/download_scan/mcafee_logo_white.svg" alt="" aria-hidden="true">
    </div>
    <div class="dls__popup__expanded">
      <div class="dls_icon_wrapper">
        <img class="dls__spinner" x-mcsrc src="images/download_scan/spinner.svg" alt="" aria-hidden="true">
        <img class="dls__icon" x-mcsrc src="images/download_scan/download_scan_icon.svg" alt="" aria-hidden="true">
      </div>
      <div class="content">
        <div class="content__images">
          <img id="dls_mcafee_logo" x-mcsrc src="images/download_scan/mcafee_webadvisor_red.svg" alt="" aria-hidden="true">
          <button type="button" id="dls_close_icon">
            <img x-mcsrc src="images/download_scan/close-outline.svg" alt="">
          </button>
        </div>
        <p id="download_scan_popup_expanded_descriptions"></p>
      </div>
    </div>
  </div>
</div>
