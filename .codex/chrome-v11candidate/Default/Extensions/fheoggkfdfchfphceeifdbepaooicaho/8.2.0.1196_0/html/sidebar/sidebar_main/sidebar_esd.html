<section id="ESD" content-id="ESD">
  <!-- Back button -->
  <div id="esd_back_btn" class="back_btn">
    <img x-mcsrc src="images/sidebar/ic_back_chevron_left.svg">
  </div>

  <div class="scroll-padding-wrapper">
    <!-- Sidebar Main Title -->
    <div id="esd_main_title" class="title"></div>

    <div id="esd_main_msg_container"  class="email_msg_container whitebox">
        <div id="esd_main_msg_container_heading" class="email_msg_container_heading">
          <img x-mcsrc src="images/sidebar/ic_email_scam.svg" class="scam_icon" />
          <img x-mcsrc src="images/sidebar/ic_email_safe.svg" class="safe_icon" />
          <div id="esd_main_msg_container_title" class="email_msg_container_heading_title" ></div>
        </div>
        <div id="esd_main_msg_container_desc" class="email_msg_container_heading_desc" ></div>
        <div id="esd_main_msg_container_scam" class="email_msg_container_scam">
          <div id="esd_main_msg_container_see_hide" class="email_msg_container_read_more"></div>
          <div id="esd_main_msg_container_expanded" class="email_msg_container_expanded">
            <div id="esd_main_msg_container_loading" class="email_msg_container_expanded_loading">
              <img  id="esd_main_msg_container_loading_img" class="email_msg_container_expanded_loading_img" x-mcsrc src="images/sidebar/ic_email_scam_loading.svg"/>
              <span id="esd_main_msg_container_loading_text" class="email_msg_container_expanded_loading_text" x-mclocalizedtext="true"></span>
            </div>
            <div id="esd_main_msg_container_expanded_explanation" class="email_msg_container_expanded_explanation">
              <div id="esd_main_msg_container_expanded_details" class="email_msg_container_expanded_explanation_details"></div>
              <div id="esd_main_msg_container_expanded_fineprint" class="email_msg_container_expanded_explanation_fineprint" x-mclocalizedtext="true"></div>
            </div>
          </div>
        </div>
        <div class="email_msg_container_feedback">
            <div id="esd_main_msg_container_feedback_text" class="email_msg_container_feedback_text" x-mclocalizedtext="true"></div>
            <div class="email_msg_container_feedback_thumbs">
              <div id="email_msg_container_feedback_thumbs_up" class="email_msg_container_feedback_thumbs_up">
                    <img x-mcsrc src="images/sidebar/ic_dfd_feedback_thumb_up.svg" />
                    <img class="selected" x-mcsrc src="images/sidebar/ic_dfd_feedback_thumb_up_active.svg" />
              </div>
              <div id="email_msg_container_feedback_thumbs_down" class="email_msg_container_feedback_thumbs_down">
                    <img x-mcsrc src="images/sidebar/ic_dfd_feedback_thumb_down.svg" />
                    <img class="selected" x-mcsrc src="images/sidebar/ic_dfd_feedback_thumb_down_active.svg" />
              </div>
            </div>
          </div>
    </div>
    
    <!-- Protection message -->
    <div id="esd_main_protection_container" class="protection_container whitebox">
        <div class="protection_container_heading">
          <img id="esd_main_protection_get_icon" class="protection_container_heading_icon" x-mcsrc src="images/sidebar/ic_get_protection_email.svg"></img>
          <img id="esd_main_protection_full_icon" class="protection_container_heading_icon" x-mcsrc src="images/sidebar/ic_full_protection_email.svg"></img>
          <div id="esd_main_protection_heading_title" class="protection_container_heading_title" ></div>
        </div>
        <div id="esd_main_protection_container_text" class="protection_container_text" ></div>
        <div id="esd_main_protection_container_btn_container" class="protection_container_btn_container">
          <div id="esd_main_protection_btn" class="protection_container_btn_container_btn_text" ></div>
          <img x-mcsrc src="images/sidebar/ic_redirect.svg">
        </div>
    </div>
    <!-- Toggle Widget -->
    <div id="esd_main_toggle_checkbox_container" class="toggle_checkbox_container whitebox">
      <div class="toggle_container">
        <div class="toggle_text">
          <div id="esd_main_toggle_title" class="toggle_title" x-mclocalizedtext="true"></div>
          <div id="esd_main_toggle_message" class="toggle_desc" x-mclocalizedtext="true"></div>
        </div>
        <div class="toggle_btn" id="esd_main_toggle_btn">
        </div>
      </div>
      <div class="consent_container">
        <div class="consent_container_checkbox">
            <input type="checkbox" id="esd_main_consent_checkbox" class='wa-checkbox'/>
        </div>
        <label id="esd_main_consent_message" for="esd_main_consent_checkbox" class="consent_container_label" x-mclocalizedtext="true"></label>
      </div>
    </div>

    <!-- Privacy Policy -->
    <div id="esd_main_privacy_policy" class="privacy_policy">
      <a href='https://www.mcafee.com/legal?tab=product' rel='noopener' target='_blank' id="esd_main_privacy_policy_text" class="privacy_policy_text" x-mclocalizedtext="true"></a>
    </div>
    
  </div>
</section>
