<section class='main-container' role="dialog" tabindex="0" aria-live="polite">
  <header>
    <div class='top'>
      <div class='top__logo'>
        <img id='header-logo' x-mcsrc src='images/web_advisor/mcafee_logo.svg' alt='WebAdvisor logo' />
        <img id='header-logo-line' x-mcsrc src='images/web_advisor/divider.svg' />
        <div id="header-logo-text"></div>
      </div>
      <div class='top__icon'>
        <img id='rat-close' x-mcsrc src='images/web_advisor/x-icon.svg' alt="close sidebar" />
      </div>
    </div>
  </header>
  <div id='main-container__innerbody' class='main-container__scroll-wrapper' tabindex="0">
    <div class="sidebar__container">
      <div class="sidebar__jumbo">
        <div class="img_div">
          <img x-mcsrc src="images/action_panel/rat-caution-icon.svg" alt="" />
        </div>
        <!-- Content -->
        <div class="jumbo__description"  tabindex="0">
          <p id="sidebar_rat_detection_title" class="jumbo__title" x-mclocalizedtext="true"></p>
          <div class="jumbo__information">
            <p id="sidebar_rat_detection_information_I" x-mclocalizedtext="true"></p>
            <p id="sidebar_rat_detection_information_II" x-mclocalizedtext="true"></p>
          </div>

          <!-- Buttons -->
          <div class="sidebar__buttons">
            <button id="rat_detection_got_it_btn" class="button__got__it">
              <span id="sidebar_rat_detection_got_it_btn_text" x-mclocalizedtext="true"></span>
            </button>
            <button id="sidebar_rat_detection_whitelist_btn" class="link__text" x-mclocalizedtext="true"></button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer>
    <div class='footer-top'>
      <button type="button" id='sidebar_view_site_report' x-mclocalizedtext='true' class='footer-top__site-report'></button>
      <a href='https://mcafee.com/support/' rel='noopener' target='_blank' id='sidebar_get_help' x-mclocalizedtext='true' class='footer-top__help'></a>
    </div>
    <div class='footer-bottom' role="contentinfo">
      <div id='sidebar_version' x-mclocalizedtext='true' class='footer-bottom__version' tabindex="0"></div>
      <a href='https://www.mcafee.com/legal?tab=product' rel='noopener' target='_blank' id='sidebar_privacy_terms' x-mclocalizedtext='true' class='footer-bottom__privacyterms'></a>
    </div>
  </footer>
</section>
