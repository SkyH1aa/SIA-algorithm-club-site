<!doctype html>
<html lang="zh-CN">
<head>

  <title>社团盘 · 算法社</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{--bg:#040814;--panel:rgba(8,17,38,.82);--line:rgba(105,154,210,.24);--text:#edf7ff;--muted:#8fa8c4;--cyan:#00e5ff;--violet:#8a6cff;--danger:#ff6b86;--shadow:0 22px 60px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg);scroll-behavior:smooth}body{min-width:320px;margin:0;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(138,108,255,.15),transparent 28%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:rgba(4,8,20,.82);backdrop-filter:blur(18px)}.topbar-inner{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,229,255,.7);border-radius:9px;color:var(--cyan);box-shadow:0 0 24px rgba(0,229,255,.18)}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.back{color:var(--muted);font-size:14px}.back:hover{color:var(--cyan)}main{max-width:1180px;margin:auto;padding:58px 22px 90px;position:relative;z-index:1}.eyebrow{margin:0 0 14px;color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:30px;align-items:end;margin-bottom:34px}.hero h1{margin:0;font-size:clamp(42px,8vw,86px);line-height:.98;letter-spacing:-2px;text-shadow:0 0 30px rgba(0,229,255,.35)}.hero p{max-width:650px;color:var(--muted);font-size:17px;line-height:1.8}.status-panel,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.status-panel{padding:20px}.status-panel strong{display:block;color:var(--cyan);font-size:24px;margin-bottom:8px}.status-panel span{color:var(--muted);font-size:13px;line-height:1.7}.panel{padding:24px}.auth-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.panel h2{margin:0 0 8px;font-size:22px}.panel-intro{margin:0 0 18px;color:var(--muted);line-height:1.7}.form{display:grid;gap:12px}.label{color:var(--muted);font-size:13px}.input{width:100%;padding:13px 14px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:rgba(2,7,18,.76);outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}.button{border:1px solid rgba(0,229,255,.55);border-radius:8px;padding:11px 15px;color:var(--text);background:rgba(0,229,255,.12);cursor:pointer;font:inherit}.button:hover{background:rgba(0,229,255,.22)}.button.secondary{border-color:var(--line);background:transparent}.button.danger{border-color:rgba(255,107,134,.5);background:rgba(255,107,134,.1)}.message{min-height:24px;margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.message.error{color:var(--danger)}.message.success{color:#72f3c2}#driveView{display:none}.drive-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}.drive-toolbar h2{margin:0}.drive-meta{color:var(--muted);font-size:13px}.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:15px 0;color:var(--muted);font-size:13px}.crumb{border:0;background:none;color:var(--cyan);cursor:pointer;font:inherit;padding:3px}.crumb.current{color:var(--text);cursor:default}.drive-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.drive-tools .input{max-width:260px;padding:10px 12px}.file-list{min-height:180px;border-top:1px solid var(--line)}.file-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 100px 190px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(105,154,210,.14)}.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-name.folder{color:var(--cyan);cursor:pointer}.file-type,.file-size{color:var(--muted);font-size:13px}.row-actions{display:flex;gap:7px;justify-content:flex-end}.row-button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);background:rgba(0,229,255,.06);cursor:pointer;font:inherit;font-size:12px}.row-button:hover{border-color:var(--cyan)}.row-button.delete{color:var(--danger)}.empty{padding:42px 0;text-align:center;color:var(--muted)}.loading{color:var(--cyan)}@media(max-width:760px){.hero,.auth-grid{grid-template-columns:1fr}.hero{margin-bottom:22px}.file-row{grid-template-columns:minmax(0,1fr) auto}.file-type,.file-size{display:none}.row-actions{grid-column:1/-1;justify-content:flex-start}.topbar-inner{padding:13px 16px}main{padding:42px 16px 70px}.panel{padding:18px}.hero h1{letter-spacing:-1px}}@media(prefers-reduced-motion:no-preference){.hero h1{animation:breathe 4s ease-in-out infinite}.panel{animation:rise .7s ease both}@keyframes breathe{50%{text-shadow:0 0 44px rgba(0,229,255,.65),0 0 74px rgba(138,108,255,.35)}}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong>算法社</strong><small>Algorithm Club</small></span></a><a class="back" href="../index.html">返回官网</a></div></header>
<main>
<section class="hero"><div><p class="eyebrow">CLUB DRIVE</p><h1>社团盘</h1><p>为算法社成员提供独立的资料空间。每位成员登录后只能访问自己的目录，文件实际保存在社团的 123 云盘中。</p></div><div class="status-panel"><strong id="heroStatus">尚未登录</strong><span id="heroHint">注册或登录后开始管理你的社团资料。</span></div></section>
<section id="authView" class="auth-grid"><div class="panel"><h2>登录社团盘</h2><p class="panel-intro">使用你的社团盘账号进入专属储存空间。</p><form class="form" id="loginForm"><label class="label" for="loginUsername">用户名</label><input class="input" id="loginUsername" autocomplete="username" required maxlength="40"><label class="label" for="loginPassword">密码</label><input class="input" id="loginPassword" type="password" autocomplete="current-password" required minlength="6"><div class="actions"><button class="button" type="submit">登录</button></div></form></div><div class="panel"><h2>注册账号</h2><p class="panel-intro">无需邮箱验证，注册后直接进入属于你的唯一文件夹。</p><form class="form" id="signupForm"><label class="label" for="signupUsername">用户名</label><input class="input" id="signupUsername" autocomplete="username" required maxlength="40"><label class="label" for="signupPassword">密码</label><input class="input" id="signupPassword" type="password" autocomplete="new-password" required minlength="6"><div class="actions"><button class="button secondary" type="submit">注册并创建空间</button></div></form></div><p class="message" id="authMessage" role="status"></p></section>
<section id="driveView" class="panel"><div class="drive-toolbar"><div><h2>我的社团盘</h2><div class="drive-meta" id="driveMeta">正在连接你的专属目录</div></div><div class="actions"><button class="button secondary" id="refreshButton" type="button">刷新</button><button class="button danger" id="logoutButton" type="button">退出登录</button></div></div><div class="drive-tools"><button class="button secondary" id="upButton" type="button">返回上级</button><button class="button" id="mkdirButton" type="button">新建文件夹</button><label class="button secondary" for="uploadInput">上传文件</label><input id="uploadInput" type="file" hidden><input class="input" id="searchInput" type="search" placeholder="搜索当前目录…" aria-label="搜索当前目录"></div><nav class="crumbs" id="breadcrumbs" aria-label="路径导航"></nav><div id="fileList" class="file-list"><div class="empty loading">正在读取文件列表…</div></div><p class="message" id="driveMessage" role="status"></p></section>
</main>
<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const authView=document.getElementById('authView'),driveView=document.getElementById('driveView'),authMessage=document.getElementById('authMessage'),driveMessage=document.getElementById('driveMessage'),heroStatus=document.getElementById('heroStatus'),heroHint=document.getElementById('heroHint'),fileList=document.getElementById('fileList'),driveMeta=document.getElementById('driveMeta'),breadcrumbs=document.getElementById('breadcrumbs'),searchInput=document.getElementById('searchInput');
let currentPath='',currentFiles=[],authSequence=0;
function setMessage(node,text,type=''){node.textContent=text;node.className=`message ${type}`}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function callDrive(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error('请先登录社团盘。');const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'社团盘操作失败。');return payload}
function renderBreadcrumbs(){const parts=currentPath?currentPath.split('/'):[];breadcrumbs.innerHTML=[`<button class="crumb ${!parts.length?'current':''}" data-path="">我的空间</button>`,...parts.map((part,index)=>`<span>/</span><button class="crumb ${index===parts.length-1?'current':''}" data-path="${escapeHtml(parts.slice(0,index+1).join('/'))}">${escapeHtml(part)}</button>`)].join('');breadcrumbs.querySelectorAll('.crumb').forEach(button=>{if(!button.classList.contains('current'))button.onclick=()=>openFolder(button.dataset.path)})}
function renderFiles(){const query=searchInput.value.trim().toLowerCase(),files=currentFiles.filter(file=>file.name.toLowerCase().includes(query));if(!files.length){fileList.innerHTML=`<div class="empty">${query?'没有匹配的文件。':'当前目录为空。'}</div>`;return}fileList.innerHTML=files.map((file,index)=>`<div class="file-row"><span class="file-name ${file.type==='文件夹'?'folder':''}" data-index="${currentFiles.indexOf(file)}">${file.type==='文件夹'?'▸ ':''}${escapeHtml(file.name)}</span><span class="file-type">${escapeHtml(file.type||'文件')}</span><span class="file-size">${escapeHtml(file.size||'-')}</span><span class="row-actions">${file.type==='文件'?`<button class="row-button download" data-index="${currentFiles.indexOf(file)}">下载</button>`:''}<button class="row-button delete" data-index="${currentFiles.indexOf(file)}">删除</button></span></div>`).join('');fileList.querySelectorAll('.folder').forEach(node=>node.onclick=()=>openFolder(`${currentPath?currentPath+'/':''}${currentFiles[Number(node.dataset.index)].name}`));fileList.querySelectorAll('.download').forEach(node=>node.onclick=()=>downloadFile(currentFiles[Number(node.dataset.index)]));fileList.querySelectorAll('.delete').forEach(node=>node.onclick=()=>deleteEntry(currentFiles[Number(node.dataset.index)]))}
async function refreshFiles(){fileList.innerHTML='<div class="empty loading">正在读取文件列表…</div>';try{const payload=await callDrive('list',{path:currentPath});currentFiles=payload.files||[];driveMeta.textContent=`专属目录 · ${currentPath||'我的空间'}`;renderBreadcrumbs();renderFiles();setMessage(driveMessage,'')}catch(error){fileList.innerHTML='<div class="empty">暂时无法读取文件列表。</div>';setMessage(driveMessage,error.message,'error')}}
async function openFolder(path){currentPath=path;searchInput.value='';await refreshFiles()}
async function deleteEntry(file){if(!confirm(`确认删除“${file.name}”吗？文件夹内的内容也会被删除。`))return;try{await callDrive('delete',{path:`${currentPath?currentPath+'/':''}${file.name}`});setMessage(driveMessage,'删除成功。','success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}}
async function downloadFile(file){try{setMessage(driveMessage,'正在准备下载…');const payload=await callDrive('download',{path:`${currentPath?currentPath+'/':''}${file.name}`});const bytes=Uint8Array.from(atob(payload.content),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:payload.contentType})),link=document.createElement('a');link.href=url;link.download=payload.name||file.name;link.click();URL.revokeObjectURL(url);setMessage(driveMessage,'下载已开始。','success')}catch(error){setMessage(driveMessage,error.message,'error')}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();setMessage(authMessage,'正在登录…');try{const username=document.getElementById('loginUsername').value.trim(),password=document.getElementById('loginPassword').value,{data,error}=await supabaseClient.auth.signInWithPassword({email:`${username}@club.local`,password});if(error)throw error;setMessage(authMessage,'登录成功。','success');await showSession(data.session)}catch(error){setMessage(authMessage,'登录失败：'+(error.message||'请检查用户名和密码。'),'error')}});
document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();setMessage(authMessage,'正在创建账号…');const username=document.getElementById('signupUsername').value.trim(),password=document.getElementById('signupPassword').value;if(!/^[a-zA-Z0-9_-]{3,40}$/.test(username)){setMessage(authMessage,'用户名只能使用 3 到 40 位字母、数字、下划线或短横线。','error');return}try{const {data,error}=await supabaseClient.auth.signUp({email:`${username}@club.local`,password,options:{data:{username}}});if(error)throw error;setMessage(authMessage,data.session?'注册成功，正在进入社团盘。':'注册成功，但当前 Supabase 仍要求邮箱确认，请关闭 Confirm email 后重试。','success');await showSession(data.session)}catch(error){setMessage(authMessage,'注册失败：'+(error.message||'请稍后重试。'),'error')}});
document.getElementById('refreshButton').onclick=refreshFiles;document.getElementById('upButton').onclick=()=>openFolder(currentPath.includes('/')?currentPath.slice(0,currentPath.lastIndexOf('/')):'');document.getElementById('mkdirButton').onclick=async()=>{const name=prompt('请输入文件夹名称');if(!name)return;try{await callDrive('mkdir',{path:currentPath,name});setMessage(driveMessage,'文件夹创建成功。','success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}};document.getElementById('uploadInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>10*1024*1024){setMessage(driveMessage,'单个文件不能超过 10 MB。','error');return}try{setMessage(driveMessage,'正在上传…');const buffer=await file.arrayBuffer(),bytes=new Uint8Array(buffer),chunk=0x8000;let binary='';for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));await callDrive('upload',{path:`${currentPath?currentPath+'/':''}${file.name}`,content:btoa(binary),contentType:file.type||'application/octet-stream'});setMessage(driveMessage,'上传成功。','success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}};searchInput.oninput=renderFiles;
async function showSession(session){const sequence=++authSequence;if(!session){authView.style.display='grid';driveView.style.display='none';heroStatus.textContent='尚未登录';heroHint.textContent='注册或登录后开始管理你的社团资料。';return}authView.style.display='none';driveView.style.display='block';heroStatus.textContent='已登录';heroHint.textContent='当前目录仅属于你的账号。';currentPath='';await refreshFiles();if(sequence!==authSequence)return}
document.getElementById('logoutButton').onclick=async()=>{await supabaseClient.auth.signOut();await showSession(null);setMessage(authMessage,'已退出登录。','success')};supabaseClient.auth.onAuthStateChange((_event,session)=>{void showSession(session)});supabaseClient.auth.getSession().then(({data:{session}})=>showSession(session));
</script>
</body>
</html>
