const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;

function formatBytes(value){if(!Number.isFinite(value))return '-';if(value<1024)return `${value} B`;if(value<1024*1024)return `${(value/1024).toFixed(1)} KB`;return `${(value/1024/1024).toFixed(1)} MB`}function beginTransfer(label,total){if(activeTransfer)throw new Error(ClubI18n.t('drive.transferBusy'));activeTransfer={cancelled:false};transfer.classList.add('active');transferLabel.textContent=label;transferProgress.value=0;transferValue.textContent='0%';transferDetail.textContent=total?`0 B / ${formatBytes(total)}`:ClubI18n.t('drive.connecting');transferCancel.disabled=false;return activeTransfer}function updateTransfer(state,loaded,total){const ratio=total?Math.min(1,loaded/total):0;transferProgress.value=ratio;transferValue.textContent=total?`${Math.round(ratio*100)}%`:formatBytes(loaded);transferDetail.textContent=total?`${formatBytes(loaded)} / ${formatBytes(total)}`:formatBytes(loaded)}function endTransfer(){transfer.classList.remove('active');transferCancel.disabled=true;activeTransfer=null}function uploadFile(file,path){return new Promise(async(resolve,reject)=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return reject(new Error(ClubI18n.t('drive.loginCenterFirst')));const state=beginTransfer(ClubI18n.t('drive.uploading'),file.size),xhr=new XMLHttpRequest();activeTransfer.xhr=xhr;transferCancel.onclick=()=>{state.cancelled=true;xhr.abort()};xhr.open('POST',FUNCTION_URL);xhr.setRequestHeader('authorization',`Bearer ${session.access_token}`);xhr.setRequestHeader('x-drive-action','upload');xhr.setRequestHeader('x-drive-path',encodeURIComponent(path));xhr.setRequestHeader('x-drive-content-type',file.type||'application/octet-stream');xhr.upload.onprogress=event=>updateTransfer(state,event.loaded,event.total||file.size);xhr.onload=()=>{try{const payload=JSON.parse(xhr.responseText||'{}');if(xhr.status>=200&&xhr.status<300)resolve(payload);else reject(new Error(payload.error||ClubI18n.t('drive.uploadFail',{status:xhr.status})))}catch(error){reject(error)}};xhr.onerror=()=>reject(new Error(ClubI18n.t('drive.uploadNetFail')));xhr.onabort=()=>reject(new Error(state.cancelled?ClubI18n.t('drive.uploadCancelled'):ClubI18n.t('drive.uploadAborted')));xhr.onloadend=()=>endTransfer();xhr.send(file)})}async function downloadFile(file){const path=`${currentPath?currentPath+'/':''}${file.name}`;try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error(ClubI18n.t('drive.loginCenterFirst'));const state=beginTransfer(ClubI18n.t('drive.downloading'),Number(file.bytes)||null),controller=new AbortController();activeTransfer.controller=controller;transferCancel.onclick=()=>{state.cancelled=true;controller.abort()};const response=await fetch(FUNCTION_URL,{method:'GET',headers:{authorization:`Bearer ${session.access_token}`,'x-drive-action':'download','x-drive-path':encodeURIComponent(path)},signal:controller.signal});if(!response.ok){const payload=await response.json().catch(()=>({}));throw new Error(payload.error||ClubI18n.t('drive.downloadFail',{status:response.status}))}if(!response.body)throw new Error(ClubI18n.t('drive.noStream'));const total=Number(response.headers.get('content-length'))||Number(response.headers.get('x-drive-bytes'))||Number(file.bytes)||0,reader=response.body.getReader(),chunks=[];let received=0;while(true){const part=await reader.read();if(part.done)break;chunks.push(part.value);received+=part.value.byteLength;updateTransfer(state,received,total)}if(received>MAX_FILE_BYTES)throw new Error(ClubI18n.t('drive.fileTooLarge'));const blob=new Blob(chunks,{type:response.headers.get('content-type')||'application/octet-stream'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setMessage(driveMessage,ClubI18n.t('drive.downloadOk'),'success')}catch(error){setMessage(driveMessage,error.name==='AbortError'?ClubI18n.t('drive.downloadCancelled'):error.message,'error')}finally{if(activeTransfer)endTransfer()}}
async function refreshInvites(){try{const payload=await callDrive('admin_list_invites');renderInvites(payload.invites||[]);setMessage(adminMessage,ClubI18n.t('drive.invitesUpdated'),'success')}catch(error){setMessage(adminMessage,error.message,'error')}}function renderInvites(invites){if(!invites.length){inviteList.innerHTML='<div class="empty">'+ClubI18n.t('drive.noInvites')+'</div>';return}inviteList.innerHTML=`<table class="invite-table"><thead><tr><th>${ClubI18n.t('drive.colInvite')}</th><th>${ClubI18n.t('drive.colStatus')}</th><th>${ClubI18n.t('drive.colCreated')}</th><th>${ClubI18n.t('drive.colUser')}</th></tr></thead><tbody>${invites.map(item=>`<tr><td><code>${escapeHtml(item.code)}</code></td><td class="${item.used_at?'invite-used':'invite-unused'}">${item.used_at?ClubI18n.t('drive.used'):ClubI18n.t('drive.unused')}</td><td>${escapeHtml(new Date(item.created_at).toLocaleString('zh-CN'))}</td><td>${escapeHtml(item.used_by||'-')}</td></tr>`).join('')}</tbody></table>`}
async function showSession(session){const sequence=++authSequence;if(!session){authView.style.display='block';driveView.style.display='none';adminView.classList.remove('active');heroStatus.textContent=ClubI18n.t('drive.notLoggedIn');heroHint.textContent=ClubI18n.t('drive.loginHint');setMessage(authMessage,ClubI18n.t('drive.authMigrated'));return}authView.style.display='none';driveView.style.display='block';heroStatus.textContent=ClubI18n.t('drive.loggedIn');heroHint.textContent=ClubI18n.t('drive.loggedInHint');setMessage(authMessage,'');currentPath='';void refreshFiles();const access=window.ClubStaffAccess?await window.ClubStaffAccess.fetchStaffAccess(session):{isSuperAdmin:false,permissions:{}};const admin=Boolean(access.isSuperAdmin||access.permissions?.can_invites);adminView.classList.toggle('active',admin);if(admin)void refreshInvites();if(sequence!==authSequence)return}
document.getElementById('refreshButton').onclick=refreshFiles;document.getElementById('upButton').onclick=()=>openFolder(currentPath.includes('/')?currentPath.slice(0,currentPath.lastIndexOf('/')):'');document.getElementById('mkdirButton').onclick=async()=>{const name=prompt(ClubI18n.t('drive.mkdirPrompt'));if(!name)return;try{await callDrive('mkdir',{path:currentPath,name});setMessage(driveMessage,ClubI18n.t('drive.mkdirOk'),'success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}};document.getElementById('uploadInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>MAX_FILE_BYTES){setMessage(driveMessage,ClubI18n.t('drive.fileTooLarge'),'error');return}try{setMessage(driveMessage,ClubI18n.t('drive.uploadingMsg'));await uploadFile(file,`${currentPath?currentPath+'/':''}${file.name}`);setMessage(driveMessage,ClubI18n.t('drive.uploadOk'),'success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}finally{if(activeTransfer)endTransfer()}};searchInput.oninput=renderFiles;document.getElementById('generateInvitesButton').onclick=async()=>{try{const count=Number(document.getElementById('inviteCount').value),payload=await callDrive('admin_generate_invites',{count});setMessage(adminMessage,ClubI18n.t('drive.invitesGenerated',{count:payload.codes.length}),'success');await refreshInvites()}catch(error){setMessage(adminMessage,error.message,'error')}};document.getElementById('adminRefreshButton').onclick=refreshInvites;document.getElementById('logoutButton').onclick=async()=>{await supabaseClient.auth.signOut();await showSession(null);setMessage(authMessage,ClubI18n.t('drive.loggedOut'),'success')};supabaseClient.auth.onAuthStateChange((_event,session)=>void showSession(session));supabaseClient.auth.getSession().then(({data:{session}})=>void showSession(session));
window.addEventListener('club:langchange',()=>{renderBreadcrumbs();renderFiles();if(window.ClubI18n)ClubI18n.apply(document);});
</script>
