<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const authView=document.getElementById('authView'),driveView=document.getElementById('driveView'),adminView=document.getElementById('adminView'),authMessage=document.getElementById('authMessage'),driveMessage=document.getElementById('driveMessage'),adminMessage=document.getElementById('adminMessage'),heroStatus=document.getElementById('heroStatus'),heroHint=document.getElementById('heroHint'),fileList=document.getElementById('fileList'),driveMeta=document.getElementById('driveMeta'),breadcrumbs=document.getElementById('breadcrumbs'),searchInput=document.getElementById('searchInput'),transfer=document.getElementById('transfer'),transferLabel=document.getElementById('transferLabel'),transferValue=document.getElementById('transferValue'),transferProgress=document.getElementById('transferProgress'),transferDetail=document.getElementById('transferDetail'),transferCancel=document.getElementById('transferCancel'),inviteList=document.getElementById('inviteList');

function renderBreadcrumbs(){const parts=currentPath?currentPath.split('/'):[];breadcrumbs.innerHTML=[`<button class="crumb ${!parts.length?'current':''}" data-path="">我的空间</button>`,...parts.map((part,index)=>`<span>/</span><button class="crumb ${index===parts.length-1?'current':''}" data-path="${escapeHtml(parts.slice(0,index+1).join('/'))}">${escapeHtml(part)}</button>`)].join('');breadcrumbs.querySelectorAll('.crumb').forEach(button=>{if(!button.classList.contains('current'))button.onclick=()=>openFolder(button.dataset.path)})}function renderFiles(){const query=searchInput.value.trim().toLowerCase(),files=currentFiles.filter(file=>file.name.toLowerCase().includes(query));if(!files.length){fileList.innerHTML=`<div class="empty">${query?'没有匹配的文件。':'当前目录为空。'}</div>`;return}fileList.innerHTML=files.map(file=>`<div class="file-row"><span class="file-name ${file.type==='文件夹'?'folder':''}" data-index="${currentFiles.indexOf(file)}">${file.type==='文件夹'?'▸ ':''}${escapeHtml(file.name)}</span><span class="file-type">${escapeHtml(file.type||'文件')}</span><span class="file-size">${escapeHtml(file.size||'-')}</span><span class="row-actions">${file.type==='文件'?`<button class="row-button download" data-index="${currentFiles.indexOf(file)}">下载</button>`:''}<button class="row-button delete" data-index="${currentFiles.indexOf(file)}">删除</button></span></div>`).join('');fileList.querySelectorAll('.folder').forEach(node=>node.onclick=()=>openFolder(`${currentPath?currentPath+'/':''}${currentFiles[Number(node.dataset.index)].name}`));fileList.querySelectorAll('.download').forEach(node=>node.onclick=()=>downloadFile(currentFiles[Number(node.dataset.index)]));fileList.querySelectorAll('.delete').forEach(node=>node.onclick=()=>deleteEntry(currentFiles[Number(node.dataset.index)]))}async function refreshFiles(){fileList.innerHTML='<div class="empty loading">正在读取文件列表…</div>';try{const payload=await callDrive('list',{path:currentPath});currentFiles=payload.files||[];driveMeta.textContent=` function formatBytes(value){if(!Number.isFinite(value))return '-';if(value<1024)return `${value} B`;if(value<1024*1024)return `${(value/1024).toFixed(1)} KB`;return `${(value/1024/1024).toFixed(1)} MB`}function beginTransfer(label,total){if(activeTransfer)throw new Error('已有文件正在传输，请先等待或取消。');activeTransfer={cancelled:false};transfer.classList.add('active');transferLabel.textContent=label;transferProgress.value=0;transferValue.textContent='0%';transferDetail.textContent=total?`0 B / ${formatBytes(total)}`:'正在连接…';transferCancel.disabled=false;return activeTransfer}function updateTransfer(state,loaded,total){const ratio=total?Math.min(1,loaded/total):0;transferProgress.value=ratio;transferValue.textContent=total?`${Math.round(ratio*100)}%`:formatBytes(loaded);transferDetail.textContent=total?`${formatBytes(loaded)} / ${formatBytes(total)}`:formatBytes(loaded)}function endTransfer(){transfer.classList.remove('active');transferCancel.disabled=true;activeTransfer=null}function uploadFile(file,path){return new Promise(async(resolve,reject)=>{const {data:{session}}=await supabaseClient.auth.getSession();if(!session)return reject(new Error('请先登录社团盘。'));const state=beginTransfer('正在上传',file.size),xhr=new XMLHttpRequest();activeTransfer.xhr=xhr;transferCancel.onclick=()=>{state.cancelled=true;xhr.abort()};xhr.open('POST',FUNCTION_URL);xhr.setRequestHeader('authorization',`Bearer ${session.access_token}`);xhr.setRequestHeader('x-drive-action','upload');xhr.setRequestHeader('x-drive-path',encodeURIComponent(path));xhr.setRequestHeader('x-drive-content-type',file.type||'application/octet-stream');xhr.upload.onprogress=event=>updateTransfer(state,event.loaded,event.total||file.size);xhr.onload=()=>{try{const payload=JSON.parse(xhr.responseText||'{}');if(xhr.status>=200&&xhr.status<300)resolve(payload);else reject(new Error(payload.error||`上传失败（${xhr.status}）。`))}catch(error){reject(error)}};xhr.onerror=()=>reject(new Error('上传网络连接失败。'));xhr.onabort=()=>reject(new Error(state.cancelled?'上传已取消。':'上传连接中断。'));xhr.onloadend=()=>endTransfer();xhr.send(file)})}async function downloadFile(file){const path=`${currentPath?currentPath+'/':''}${file.name}`;try{const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error('请先登录社团盘。');const state=beginTransfer('正在下载',Number(file.bytes)||null),controller=new AbortController();activeTransfer.controller=controller;transferCancel.onclick=()=>{state.cancelled=true;controller.abort()};const response=await fetch(FUNCTION_URL,{method:'GET',headers:{authorization:`Bearer ${session.access_token}`,'x-drive-action':'download','x-drive-path':encodeURIComponent(path)},signal:controller.signal});if(!response.ok){const payload=await response.json().catch(()=>({}));throw new Error(payload.error||`下载失败（${response.status}）。`)}if(!response.body)throw new Error('浏览器不支持流式下载。');const total=Number(response.headers.get('content-length'))||Number(response.headers.get('x-drive-bytes'))||Number(file.bytes)||0,reader=response.body.getReader(),chunks=[];let received=0;while(true){const part=await reader.read();if(part.done)break;chunks.push(part.value);received+=part.value.byteLength;updateTransfer(state,received,total)}if(received>MAX_FILE_BYTES)throw new Error('单个文件不能超过 100 MiB。');const blob=new Blob(chunks,{type:response.headers.get('content-type')||'application/octet-stream'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setMessage(driveMessage,'下载成功。','success')}catch(error){setMessage(driveMessage,error.name==='AbortError'?'下载已取消。':error.message,'error')}finally{if(activeTransfer)endTransfer()}}

async function showSession(session){const sequence=++authSequence;if(!session){authView.style.display='grid';driveView.style.display='none';adminView.classList.remove('active');heroStatus.textContent='尚未登录';heroHint.textContent='注册或登录后开始管理你的社团资料。';return}const admin=['haimingadmin@club.local','collen@club.local'].includes(session.user?.email?.toLowerCase());authView.style.display='none';driveView.style.display='block';adminView.classList.toggle('active',admin);heroStatus.textContent='已登录';heroHint.textContent='当前目录仅属于你的账号。';currentPath='';void refreshFiles();if(admin)void refreshInvites();if(sequence!==authSequence)return}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();setMessage(authMessage,'正在登录…');try{const username=document.getElementById('loginUsername').value.trim(),password=document.getElementById('loginPassword').value,{data,error}=await supabaseClient.auth.signInWithPassword({email:`${username}@club.local`,password});if(error)throw error;setMessage(authMessage,'登录成功。','success');await showSession(data.session)}catch(error){setMessage(authMessage,'登录失败：'+(error.message||'请检查用户名和密码。'),'error')}});document.getElementById('signupForm').addEventListener('submit',async e=>{e.preventDefault();setMessage(authMessage,'正在验证邀请码并创建账号…');const username=document.getElementById('signupUsername').value.trim(),password=document.getElementById('signupPassword').value,inviteCode=document.getElementById('signupInviteCode').value.trim().toUpperCase();if(!/^[a-zA-Z0-9_-]{3,40}$/.test(username)){setMessage(authMessage,'用户名只能使用 3 到 40 位字母、数字、下划线或短横线。','error');return}try{const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'signup',username,password,inviteCode})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'注册失败。');const {data,error}=await supabaseClient.auth.signInWithPassword({email:`${username}@club.local`,password});if(error)throw error;setMessage(authMessage,'注册成功，正在进入社团盘。','success');await showSession(data.session)}catch(error){setMessage(authMessage,'注册失败：'+(error.message||'请稍后重试。'),'error')}});document.getElementById('refreshButton').onclick=refreshFiles;document.getElementById('upButton').onclick=()=>openFolder(currentPath.includes('/')?currentPath.slice(0,currentPath.lastIndexOf('/')):'');document.getElementById('mkdirButton').onclick=async()=>{const name=prompt('请输入文件夹名称');if(!name)return;try{await callDrive('mkdir',{path:currentPath,name});setMessage(driveMessage,'文件夹创建成功。','success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}};document.getElementById('uploadInput').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;if(file.size>MAX_FILE_BYTES){setMessage(driveMessage,'单个文件不能超过 100 MiB。','error');return}try{setMessage(driveMessage,'正在上传…');await uploadFile(file,`${currentPath?currentPath+'/':''}${file.name}`);setMessage(driveMessage,'上传成功。','success');await refreshFiles()}catch(error){setMessage(driveMessage,error.message,'error')}finally{if(activeTransfer)endTransfer()}};searchInput.oninput=renderFiles;document.getElementById('generateInvitesButton').onclick=async()=>{try{const count=Number(document.getElementById('inviteCount').value),payload=await callDrive('admin_generate_invites',{count});setMessage(adminMessage,`已生成 ${payload.codes.length} 个邀请码。请复制保存。`,'success');await refreshInvites()}catch(error){setMessage(adminMessage,error.message,'error')}};document.getElementById('adminRefreshButton').onclick=refreshInvites;document.getElementById('logoutButton').onclick=async()=>{await supabaseClient.auth.signOut();await showSession(null);setMessage(authMessage,'已退出登录。','success')};supabaseClient.auth.onAuthStateChange((_event,session)=>void showSession(session));supabaseClient.auth.getSession().then(({data:{session}})=>void showSession(session));
</script>
