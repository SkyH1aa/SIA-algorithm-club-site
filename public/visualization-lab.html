    :root{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;color:#f6fbff;background:#020409;--bg:#020409;--panel:rgba(8,13,30,.8);--cyan:#00e5ff;--violet:#7c4dff;--pink:#ff5fc8;--gold:#ffd166;--text:#c8d4e2;--muted:#8fa3b8;--line:rgba(115,221,255,.2);--shadow:0 24px 90px rgba(0,229,255,.13)}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(ellipse 70% 50% at 14% 4%,rgba(0,229,255,.16),transparent 62%),radial-gradient(ellipse 60% 42% at 88% 7%,rgba(124,77,255,.22),transparent 65%),linear-gradient(180deg,#020409,#050917 50%,#020409);color:#f6fbff;overflow-x:hidden}body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(rgba(0,229,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.045) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse 110% 100% at 50% 10%,#000,transparent 92%)}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:20px;padding:14px clamp(18px,5vw,72px);border-bottom:1px solid var(--line);background:rgba(2,4,12,.78);backdrop-filter:blur(18px)}.brand{display:inline-flex;align-items:center;gap:12px;margin-right:auto}.brand-mark{display:grid;place-items:center;width:42px;height:42px;border:1px solid rgba(0,229,255,.55);border-radius:8px;background:linear-gradient(135deg,rgba(0,229,255,.18),rgba(124,77,255,.22));color:var(--cyan);font-weight:900;box-shadow:0 0 28px rgba(0,229,255,.22),inset 0 0 24px rgba(124,77,255,.18)}.brand strong,.brand small{display:block}.brand strong{font-size:16px}.brand small{color:var(--muted);font-size:12px;text-transform:uppercase}.member-identity{display:none;padding:5px 9px;border:1px solid rgba(0,229,255,.34);border-radius:999px;color:var(--cyan);font-size:12px;white-space:nowrap}.member-identity:not([hidden]){display:inline-flex}.back-link{padding:8px 12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:14px;transition:.2s}.back-link:hover{border-color:rgba(0,229,255,.55);background:rgba(0,229,255,.08);color:var(--cyan)}main{max-width:1160px;margin:0 auto;padding:clamp(58px,10vw,112px) clamp(18px,5vw,72px) 70px}.intro{max-width:760px}.eyebrow{margin:0 0 12px;color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:2px}.intro h1{margin:0;font-size:clamp(34px,6vw,60px);letter-spacing:.5px;text-shadow:0 0 28px rgba(0,229,255,.25)}.intro p:not(.eyebrow){margin:16px 0 0;color:var(--text);font-size:17px;line-height:1.8}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:48px}.choice{position:relative;min-height:330px;padding:30px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--panel);box-shadow:var(--shadow);transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease}.choice::before{content:"";position:absolute;inset:auto -12% -46% auto;width:260px;aspect-ratio:1;border:1px solid rgba(0,229,255,.25);border-radius:50%;box-shadow:0 0 70px rgba(0,229,255,.2),inset 0 0 45px rgba(0,229,255,.09)}.choice.search::before{border-color:rgba(255,95,200,.25);box-shadow:0 0 70px rgba(124,77,255,.25),inset 0 0 45px rgba(255,95,200,.08)}.choice:hover{transform:translateY(-5px);border-color:rgba(0,229,255,.62);box-shadow:0 30px 100px rgba(0,229,255,.2)}.choice.search:hover{border-color:rgba(255,95,200,.65)}.choice-content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:flex-start}.choice-icon{display:grid;place-items:center;width:52px;height:52px;border:1px solid rgba(0,229,255,.55);border-radius:9px;color:var(--cyan);font:800 22px/1 ui-monospace,Consolas,monospace;background:rgba(0,229,255,.1)}.search .choice-icon{border-color:rgba(255,95,200,.55);color:var(--pink);background:rgba(255,95,200,.1)}.choice h2{margin:25px 0 10px;font-size:28px}.choice p{max-width:400px;margin:0;color:var(--text);line-height:1.75}.
