  <style>
    /* 只影响本页：结果关键词高亮与分组标题层级（h2 → h3，样式沿用 club-ui 的分组标题约定） */
    body.club-page .site-search-group h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: var(--club-fs-md); }
    body.club-page .site-search-group mark {
      background: var(--club-accent-soft); color: inherit;
      padding: 0 2px; border-radius: 3px;
    }
  </style>
</head>
<body class="club-page">
  <header class="topbar"><div class="topbar-inner">
    <a class="brand" href="../index.html"><span class="brand-mark">A</span><span><strong data-i18n="common.brand">算法社</strong><small>Search</small></span></a>
    <a class="back" href="club-features.html" data-i18n="common.backFeatures">返回社团功能</a>
  </div></header>
  <main>
    <p class="eyebrow">SITE SEARCH</p>
    <h1 data-i18n="search.title">站内搜索</h1>
    <p class="lead" data-i18n="search.intro">搜索社员、公告、活动与积分商城商品。未登录也可使用。</p>
    <section class="panel">
      <form class="site-search-form" id="searchForm" role="search">
        <input class="input" id="searchInput" type="search" data-club-search autocomplete="off"
               data-i18n-placeholder="search.placeholder" placeholder="输入姓名、标题或关键词…" aria-label="搜索">
        <button class="button" type="submit" data-i18n="search.submit">搜索</button>
      </form>
      <div class="site-search-groups" id="results" aria-live="polite">
        <p class="empty" data-i18n="search.hint">输入关键词开始搜索。</p>
      </div>
      <p class="message" id="message" role="status"></p>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const $ = id => document.getElementById(id);
    const t = (key, vars) => (window.ClubI18n ? ClubI18n.t(key, vars) : key);
    const escapeHtml = window.ClubCommon
      ? ClubCommon.escapeHtml
      : value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    const GROUP_LABELS = {
      member: 'search.groupMember',
      announcement: 'search.groupAnnouncement',
      event: 'search.groupEvent',
      product: 'search.groupProduct',
      resource: 'search.groupResource'
    };

    let lastQuery = '';
    let debounceTimer = null;

    // 结果关键词高亮：先 escapeHtml 再对“已转义文本”做大小写不敏感替换，
    // 这样 < > & 等字符不会绕过转义（查询词本身也先转义再拼正则）。
    function highlight(text, query) {
      const safe = escapeHtml(text);
      const raw = String(query || '').trim();
      if (!raw || raw.length > 100) return safe;
      const pattern = escapeHtml(raw).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      try {
        return safe.replace(new RegExp(pattern, 'gi'), match => `<mark>${match}</mark>`);
      } catch (_error) {
        return safe;
      }
    }

    async function runSearch(query) {
      const text = String(query || '').trim();
      lastQuery = text;
      const results = $('results');
      if (!text) {
        results.innerHTML = `<p class="empty">${escapeHtml(t('search.hint'))}</p>`;
        return;
      }
      ClubCommon.listState(results, { kind: 'loading', message: t('search.loading') });
      try {
        const response = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'content-type': 'application/json', apikey: SUPABASE_KEY },
          body: JSON.stringify({ action: 'search_all', query: text })
        });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.error || t('search.failed'));
        render(payload.groups || [], text);
      } catch (error) {
        ClubCommon.listState(results, { kind: 'error', title: t('search.failed'), message: error.message, onRetry: () => runSearch(lastQuery) });
      }
    }

    function render(groups, query) {
      const results = $('results');
      const total = groups.reduce((sum, group) => sum + group.items.length, 0);
      if (!total) {
        ClubCommon.listState(results, { kind: 'empty', title: t('search.empty', { q: query }), message: t('search.emptyHint') });
        return;
      }
      results.innerHTML = groups.map(group => `
        <section class="site-search-group">
          <h3>${escapeHtml(t(GROUP_LABELS[group.type] || 'search.groupOther'))} <span class="badge">${group.items.length}</span></h3>
          <ul>${group.items.map(item => `
            <li>
              <a href="${escapeHtml(item.link)}">${highlight(item.title, query)}</a>
              ${item.subtitle ? `<span>${highlight(item.subtitle, query)}</span>` : ''}
            </li>`).join('')}
          </ul>
        </section>`).join('');
    }

    $('searchForm').addEventListener('submit', event => {
      event.preventDefault();
      clearTimeout(debounceTimer);
      const query = $('searchInput').value;
      const url = new URL(location.href);
      if (query.trim()) url.searchParams.set('q', query.trim()); else url.searchParams.delete('q');
      history.replaceState(null, '', url);
      void runSearch(query);
    });

    // 输入防抖即时搜索：停顿 300ms 后自动搜索；回车/点击“搜索”仍立即执行并同步 URL。
    $('searchInput').addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = $('searchInput').value;
      debounceTimer = setTimeout(() => { void runSearch(query); }, 300);
    });

    document.addEventListener('DOMContentLoaded', () => {
      const initial = new URLSearchParams(location.search).get('q') || '';
      $('searchInput').value = initial;
      if (initial) void runSearch(initial);
      window.addEventListener('club:langchange', () => { if (lastQuery) void runSearch(lastQuery); });
    });
  </script>
  <script src="club-shell.js?v=9b6a29db"></script>
</body>
</html>
