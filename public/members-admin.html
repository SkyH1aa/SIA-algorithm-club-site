<!doctype html>
<html lang="zh-CN" data-i18n-title-key="pages.membersAdmin.title">
<head>
  <link rel="stylesheet" href="theme.css?v=39014235">
  <link rel="stylesheet" href="club-ui.css?v=f12be04a">
  <script src="theme.js?v=1b745a4f"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成员展示管理 · 算法社</title>
  <script src="vendor/supabase/supabase.min.js?v=8596965f"></script>
  <script src="club-auth-storage.js?v=5469c150"></script>

  <script src="i18n-dict.js?v=c79bfe69"></script><script src="member-identity.js?v=ad75d585" defer></script>
  <script src="i18n.js?v=ba66328e"></script><script src="club-common.js?v=b3d82c39"></script>
<script src="service-prompts.js?v=1cfff2ab"></script><script src="service-gate.js?v=6acc9c5f"></script></head>
<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span><strong data-i18n="common.brand">算法社</strong><small>Members Admin</small></span></a><span class="identity" data-member-identity hidden></span><a class="back" href="admin-hub.html" data-i18n="common.backAdmin">返回管理员总览</a></div></header>

  <div class="club-admin-rail" data-club-admin-rail aria-label="管理模块"></div><main>
    <section id="gate" class="panel gate"><div><strong data-i18n="common.loginFirst">请先登录</strong><p class="intro" data-i18n="admin.membersGateLead">成员展示管理需要对应权限。</p><a class="button" href="member-center.html" data-i18n="common.loginCenter">前往个人中心登录</a></div></section>
    <section id="denied" class="panel denied hidden"><div><strong data-i18n="admin.membersDenied">无成员展示管理权限</strong><p class="intro" data-i18n="admin.membersDeniedLead">请联系超管开通「成员展示」权限。</p></div></section>
    <div id="content" class="hidden">
      <p class="eyebrow">SHOWCASE MEMBERS ADMIN</p>
      <h1 data-i18n="pages.membersAdmin.h1">成员展示管理</h1>
      <p class="lead" data-i18n="admin.membersLead">管理首页「成员展示」卡片：填写姓名、班级、简介与可选图床图片 URL。留空图片表示无图；取消展示后首页不会显示该卡片。</p>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2 data-i18n="admin.memberFormTitle">添加 / 编辑成员卡片</h2>
            <p class="intro" data-i18n="admin.memberFormIntro">配图只需填写图床图片 URL；留空表示默认无图片。已展示成员也可直接编辑。</p>
          </div>
          <button class="button secondary" type="button" id="exportMembers" data-i18n="admin.exportCsv">导出 CSV</button>
          <button class="button secondary" type="button" id="refreshMembers" data-i18n="admin.refreshList">刷新列表</button>
        </div>
        <form class="form" id="memberForm">
          <input type="hidden" id="memberId">
          <div class="grid-2">
            <div><label class="label" for="memberName" data-i18n="admin.memberName">姓名</label><input class="input" id="memberName" maxlength="40" required placeholder="例如 陈海铭" data-i18n-placeholder="admin.phMemberName"></div>
            <div><label class="label" for="memberClass" data-i18n="admin.memberClass">班级 / 职务</label><input class="input" id="memberClass" maxlength="80" placeholder="例如 A1C5-社长" data-i18n-placeholder="admin.phMemberClass"></div>
          </div>
          <div class="grid-2">
            <div><label class="label" for="memberImageUrl" data-i18n="admin.memberImage">图床图片 URL（可选）</label><input class="input" id="memberImageUrl" maxlength="500" placeholder="https://... 留空=无图片" data-i18n-placeholder="admin.phMemberImage"></div>
            <div><label class="label" for="memberSort" data-i18n="admin.memberSort">排序（越小越靠前）</label><input class="input" id="memberSort" type="number" min="0" max="100000" value="0"></div>
          </div>
          <label class="label" for="memberIntro" data-i18n="admin.memberIntro">简介</label>
          <textarea class="textarea" id="memberIntro" maxlength="500" placeholder="一句话介绍方向、职责或贡献" data-i18n-placeholder="admin.phMemberIntro"></textarea>
          <div class="checks"><label><input type="checkbox" id="memberVisible" checked> <span data-i18n="admin.showOnHome">在首页展示</span></label></div>
          <div class="actions">
            <button class="button" type="submit" id="memberSaveButton" data-i18n="admin.saveMember">保存成员</button>
            <button class="button secondary" type="button" id="resetMember" data-i18n="common.clearForm">清空表单</button>
          </div>
        </form>
        <p class="message" id="memberMessage" role="status"></p>
        <div class="table-wrap" id="memberList" style="margin-top:16px"><div class="empty loading" data-i18n="admin.loadingMembers">正在读取成员展示…</div></div>
      </section>
    </div>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    const t = (key, vars) => (window.ClubI18n ? ClubI18n.t(key, vars) : key);
    let membersCache = [];
    let currentSession = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function formatTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('zh-CN', { hour12: false });
    }
    function setMessage(node, text, type = '') {
      node.textContent = text || '';
      node.className = `message ${type}`;
    }
    async function call(action, body = {}) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) throw new Error(t('admin.loginPlease'));
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          authorization: `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ action, ...body })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw ClubCommon.handleAuthError(response, payload, t('admin.opFailed'));
      return payload;
    }

    function resetMemberForm() {
      $('memberForm').reset();
      $('memberId').value = '';
      $('memberSort').value = '0';
      $('memberVisible').checked = true;
      $('memberSaveButton').textContent = t('admin.saveMember');
      setMessage($('memberMessage'), '');
    }

    function startEditMember(id) {
      const member = membersCache.find(item => item.id === id);
      if (!member) return;
      $('memberId').value = member.id;
      $('memberName').value = member.name || '';
      $('memberClass').value = member.member_class || '';
      $('memberImageUrl').value = member.image_url || '';
      $('memberIntro').value = member.intro || '';
      $('memberSort').value = member.sort_order ?? 0;
      $('memberVisible').checked = member.is_visible !== false;
      $('memberSaveButton').textContent = t('admin.saveChanges');
      setMessage($('memberMessage'), t('admin.editingMember', { name: member.name }), 'success');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderMembers(members) {
      membersCache = members;
      if (!members.length) {
        ClubCommon.listState($('memberList'), { kind: 'empty', title: t('admin.emptyMembers') });
        return;
      }
      $('memberList').innerHTML = `<table class="table"><thead><tr><th>${t('admin.colPhoto')}</th><th>${t('admin.colName')}</th><th>${t('admin.colRole')}</th><th>${t('admin.memberIntro')}</th><th>${t('admin.colStatus')}</th><th>${t('admin.colSort')}</th><th>${t('admin.colUpdated')}</th><th>${t('admin.colActions')}</th></tr></thead><tbody>${members.map(item => `
        <tr>
          <td>${item.image_url ? `<img class="thumb" src="${escapeHtml(item.image_url)}" alt="" loading="lazy" decoding="async">` : `<span class="badge off">${t('admin.noPhoto')}</span>`}</td>
          <td><strong>${escapeHtml(item.name)}</strong></td>
          <td>${escapeHtml(item.member_class || '-')}</td>
          <td><div style="color:var(--muted);font-size:12px;line-height:1.5;max-width:280px">${escapeHtml(item.intro || '-')}</div></td>
          <td><span class="badge ${item.is_visible ? 'on' : 'off'}">${item.is_visible ? t('admin.visible') : t('admin.hidden')}</span></td>
          <td>${escapeHtml(item.sort_order ?? 0)}</td>
          <td>${escapeHtml(formatTime(item.updated_at))}</td>
          <td class="actions">
            <button class="button secondary" type="button" data-edit-member="${escapeHtml(item.id)}" data-i18n="common.edit">编辑</button>
            <button class="button danger" type="button" data-delete-member="${escapeHtml(item.id)}">${t('admin.remove')}</button>
          </td>
        </tr>
      `).join('')}</tbody></table>`;

      if (window.ClubI18n?.apply) ClubI18n.apply($('memberList'));
      $('memberList').querySelectorAll('[data-edit-member]').forEach(button => {
        button.addEventListener('click', () => startEditMember(button.getAttribute('data-edit-member')));
      });
      $('memberList').querySelectorAll('[data-delete-member]').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.getAttribute('data-delete-member');
          const member = membersCache.find(item => item.id === id);
          if (!(await ClubCommon.confirm({ message: t('admin.confirmRemoveMember', { name: member?.name || id }) }))) return;
          setMessage($('memberMessage'), t('admin.removing'));
          try {
            await call('admin_showcase_members_delete', { id });
            setMessage($('memberMessage'), t('admin.memberRemoved'), 'success');
            if ($('memberId').value === id) resetMemberForm();
            await refreshMembers();
          } catch (error) {
            setMessage($('memberMessage'), error.message, 'error');
          }
        });
      });
    }

    function exportMembers() {
      const rows = membersCache || [];
      if (!rows.length) { setMessage($('memberMessage'), t('admin.exportEmpty'), 'error'); return; }
      const count = ClubCommon.exportCsv(`club-members-${new Date().toISOString().slice(0,10)}.csv`, [
        { label: t('admin.colMemberName'), value: row => row.name },
        { label: t('admin.colMemberClass'), value: row => row.member_class },
        { label: t('admin.colIntro'), value: row => row.intro }
      ], rows);
      setMessage($('memberMessage'), t('admin.exportOk', { n: count }), 'success');
    }
    document.addEventListener('DOMContentLoaded', () => { $('exportMembers').addEventListener('click', exportMembers); });

    async function refreshMembers() {
      ClubCommon.listState($('memberList'), { kind: 'loading', message: t('admin.loadingMembers') });
      try {
        const payload = await call('admin_showcase_members_list');
        renderMembers(payload.members || []);
        setMessage($('memberMessage'), '');
      } catch (error) {
        ClubCommon.listState($('memberList'), { kind: 'error', title: t('admin.emptyMembersFail'), onRetry: refreshMembers });
        setMessage($('memberMessage'), error.message, 'error');
      }
    }

    async function updateView(session) {
      currentSession = session;
      const loggedIn = Boolean(session?.user?.id);
      $('gate').classList.toggle('hidden', loggedIn);
      if (!loggedIn) {
        $('denied').classList.add('hidden');
        $('content').classList.add('hidden');
        return;
      }
      const access = window.ClubStaffAccess
        ? await window.ClubStaffAccess.fetchStaffAccess(session)
        : { isSuperAdmin: false, permissions: {} };
      const allowed = Boolean(access.isSuperAdmin || access.permissions?.can_members);
      $('denied').classList.toggle('hidden', allowed);
      $('content').classList.toggle('hidden', !allowed);
      if (allowed) await refreshMembers();
    }

    $('resetMember').addEventListener('click', resetMemberForm);
    $('refreshMembers').addEventListener('click', refreshMembers);
    $('memberForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage($('memberMessage'), t('admin.savingMember'));
      try {
        const id = $('memberId').value.trim();
        await call('admin_showcase_members_save', {
          id: id || undefined,
          name: $('memberName').value.trim(),
          memberClass: $('memberClass').value.trim(),
          intro: $('memberIntro').value.trim(),
          imageUrl: $('memberImageUrl').value.trim(),
          sortOrder: Number($('memberSort').value || 0),
          isVisible: $('memberVisible').checked
        });
        setMessage($('memberMessage'), id ? t('admin.memberUpdated') : t('admin.memberAdded'), 'success');
        resetMemberForm();
        await refreshMembers();
      } catch (error) {
        setMessage($('memberMessage'), error.message, 'error');
      }
    });

    supabaseClient.auth.onAuthStateChange((_event, session) => { void updateView(session); });
    supabaseClient.auth.getSession().then(({ data: { session } }) => updateView(session));

    window.addEventListener('club:langchange', () => {
      try {
        if (window.ClubI18n?.apply) ClubI18n.apply(document);
        if (typeof refreshMembers === 'function' && currentSession) void refreshMembers();
      } catch (_e) {}
    });
  </script>
  <script src="club-shell.js?v=6f76acb2"></script>
</body>
</html>
