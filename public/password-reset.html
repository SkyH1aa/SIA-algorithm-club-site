<!doctype html>
<html lang="zh-CN" data-i18n-title-key="pages.password.title">
<head>
  <link rel="stylesheet" href="theme.css">
  <script src="theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · 算法社</title>
    <script src="i18n-dict.js"></script>
  <script src="i18n.js"></script>
<style>
    :root{--bg:#040814;--panel:rgba(8,17,38,.84);--line:rgba(105,154,210,.24);--text:#edf7ff;--muted:#8fa8c4;--cyan:#00e5ff;--green:#72f3c2;--danger:#ff6b86;--shadow:0 22px 60px rgba(0,0,0,.32)}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-width:320px;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(138,108,255,.15),transparent 28%),var(--bg)}
    a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:rgba(4,8,20,.82);backdrop-filter:blur(18px)}.topbar-inner{max-width:980px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,229,255,.7);border-radius:9px;color:var(--cyan)}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.back{color:var(--muted)}.back:hover{color:var(--cyan)}
    main{max-width:980px;margin:auto;padding:56px 22px 90px}.eyebrow{margin:0 0 12px;color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}h1{margin:0 0 12px;font-size:clamp(36px,7vw,64px);letter-spacing:-1.4px;line-height:.98}.lead{max-width:720px;margin:0 0 24px;color:var(--muted);line-height:1.8}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.panel{padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow)}.panel h2{margin:0 0 8px;font-size:22px}.intro{margin:0 0 16px;color:var(--muted);line-height:1.7}.form{display:grid;gap:12px}.label{color:var(--muted);font-size:13px}.input{width:100%;padding:13px 14px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:rgba(2,7,18,.76);outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}.button{border:1px solid rgba(0,229,255,.55);border-radius:8px;padding:11px 15px;color:var(--text);background:rgba(0,229,255,.12);cursor:pointer;font:inherit}.button:hover{background:rgba(0,229,255,.22)}.message{min-height:22px;margin:12px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.message.error{color:var(--danger)}.message.success{color:var(--green)}.note{margin-top:18px;color:var(--muted);font-size:13px;line-height:1.7}
    @media(max-width:760px){.grid{grid-template-columns:1fr}.topbar-inner,main{padding-left:16px;padding-right:16px}}
  </style>
</head>
<body>
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong data-i18n="common.brand">算法社</strong><small>Password Reset</small></span></a><a class="back" href="member-center.html" data-i18n="common.backMemberLogin">返回个人中心登录</a></div></header>
  <main>
    <p class="eyebrow">PASSWORD RESET</p>
    <h1 data-i18n="pages.password.h1">重置密码</h1>
    <p class="lead" data-i18n="password.lead">不会删除账号，也不会清空积分、绑定资料或社团盘文件。先提交申请，等管理员生成 24 小时有效秘钥后，再在这里设置新密码。</p>
    <section class="grid">
      <div class="panel">
        <h2 data-i18n="password.step1">1. 提交重置申请</h2>
        <p class="intro" data-i18n="password.step1Intro">输入你的社团盘账号名。管理员会在总览里看到申请，并生成与该账号唯一对应的秘钥。</p>
        <form class="form" id="requestForm">
          <label class="label" for="requestUsername" data-i18n="password.username">账号名</label>
          <input class="input" id="requestUsername" maxlength="40" required placeholder="例如 aabbcc" data-i18n-placeholder="password.usernamePlaceholder">
          <button class="button" type="submit" data-i18n="password.submitRequest">提交申请</button>
        </form>
        <p class="message" id="requestMessage" role="status"></p>
      </div>
      <div class="panel">
        <h2 data-i18n="password.step2">2. 使用秘钥设置新密码</h2>
        <p class="intro" data-i18n="password.step2Intro">拿到管理员给你的秘钥后，在这里输入账号、秘钥和新密码。秘钥自申请生成起 24 小时内有效，用过后立即失效。</p>
        <form class="form" id="resetForm">
          <label class="label" for="resetUsername" data-i18n="password.username">账号名</label>
          <input class="input" id="resetUsername" maxlength="40" required>
          <label class="label" for="resetSecret" data-i18n="password.secret">重置秘钥</label>
          <input class="input" id="resetSecret" maxlength="40" required placeholder="例如 ABCD-EFGH-JKLM-NPQR" data-i18n-placeholder="password.secretPlaceholder">
          <label class="label" for="resetPassword" data-i18n="password.newPassword">新密码</label>
          <input class="input" id="resetPassword" type="password" minlength="6" required>
          <label class="label" for="resetPasswordConfirm" data-i18n="password.confirmPassword">确认新密码</label>
          <input class="input" id="resetPasswordConfirm" type="password" minlength="6" required>
          <button class="button" type="submit" data-i18n="password.confirmReset">确认重置</button>
        </form>
        <p class="message" id="resetMessage" role="status"></p>
      </div>
    </section>
    <p class="note" data-i18n="password.note">说明：系统不会保存、也不会向任何人展示明文密码。管理员只能生成重置秘钥，或直接帮你改成新密码。</p>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const $ = id => document.getElementById(id);

    function setMessage(node, text, type = '') {
      node.textContent = text;
      node.className = `message ${type}`;
    }

    async function callPublic(action, body = {}) {
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, ...body })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || ClubI18n.t('password.requestFailed'));
      return payload;
    }

    $('requestForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      setMessage($('requestMessage'), ClubI18n.t('password.submitting'));
      try {
        const payload = await callPublic('password_reset_request', {
          username: $('requestUsername').value.trim()
        });
        setMessage($('requestMessage'), payload.message || ClubI18n.t('password.requestOk'), 'success');
      } catch (error) {
        setMessage($('requestMessage'), error.message, 'error');
      }
    });

    $('resetForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = $('resetPassword').value;
      const confirm = $('resetPasswordConfirm').value;
      if (password !== confirm) {
        setMessage($('resetMessage'), ClubI18n.t('password.mismatch'), 'error');
        return;
      }
      setMessage($('resetMessage'), ClubI18n.t('password.resetting'));
      try {
        const payload = await callPublic('password_reset_with_secret', {
          username: $('resetUsername').value.trim(),
          secret: $('resetSecret').value.trim(),
          password
        });
        setMessage($('resetMessage'), payload.message || ClubI18n.t('password.resetOk'), 'success');
        $('resetSecret').value = '';
        $('resetPassword').value = '';
        $('resetPasswordConfirm').value = '';
      } catch (error) {
        setMessage($('resetMessage'), error.message, 'error');
      }
    });
  </script>
</body>
</html>
