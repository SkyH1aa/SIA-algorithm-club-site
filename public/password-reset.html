<!doctype html>
<html lang="zh-CN" data-i18n-title-key="pages.password.title">
<head>
  <link rel="stylesheet" href="theme.css?v=39c53cdb">
  <link rel="stylesheet" href="club-ui.css?v=793635b1">
  <style>
    /* 页内微调：改密成功态（门禁锁形图标已上收 club-ui.css），全部走 --club-* 令牌 */
    body.club-page .panel > .form{margin-top:4px}
    body.club-page .reset-success{display:grid;justify-items:flex-start;gap:6px;margin-top:14px;padding:15px 16px;border:1px solid color-mix(in srgb,var(--club-ok) 45%,transparent);border-radius:var(--club-radius-sm);background:var(--club-ok-soft)}
    body.club-page .reset-success strong{display:flex;align-items:center;gap:8px;color:var(--club-ok);font-size:14.5px}
    body.club-page .reset-success svg{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    body.club-page .reset-success > span{color:var(--club-text-soft);font-size:13px;line-height:1.6}
    body.club-page .reset-success .button{min-height:34px;margin-top:4px;font-size:12.5px}
  </style>
  <script src="theme.js?v=1b745a4f"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · 算法社</title>
    <script src="i18n-dict.js?v=f75071ae"></script>
  <script src="i18n.js?v=ba66328e"></script><script src="club-common.js?v=333db1c4"></script>
<script src="service-prompts.js?v=1cfff2ab"></script><script src="service-gate.js?v=6acc9c5f"></script></head>
<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span><strong data-i18n="common.brand">算法社</strong><small>Password Reset</small></span></a><a class="back" href="member-center.html" data-i18n="common.backMemberLogin">返回个人中心登录</a></div></header>
  <main>
    <p class="eyebrow">PASSWORD RESET</p>
    <h1 data-i18n="pages.password.h1">重置密码</h1>
    <p class="lead" data-i18n="password.lead">不会删除账号，也不会清空积分、绑定资料或社团盘文件。先提交申请，等管理员生成 24 小时有效秘钥后，再在这里设置新密码。</p>
    <section class="grid">
      <div class="panel">
        <span class="gate-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg></span>
        <h2 data-i18n="password.step1">1. 提交重置申请</h2>
        <p class="intro" data-i18n="password.step1Intro">输入你的社团盘账号名。管理员会在总览里看到申请，并生成与该账号唯一对应的秘钥。</p>
        <form class="form" id="requestForm">
          <div class="field">
            <label class="label" for="requestUsername" data-i18n="password.username">账号名</label>
            <input class="input" id="requestUsername" maxlength="40" required placeholder="例如 aabbcc" autocomplete="username" data-i18n-placeholder="password.usernamePlaceholder">
          </div>
          <button class="button" type="submit" data-i18n="password.submitRequest">提交申请</button>
        </form>
        <p class="message" id="requestMessage" role="status"></p>
      </div>
      <div class="panel">
        <span class="gate-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg></span>
        <h2 data-i18n="password.step2">2. 使用秘钥设置新密码</h2>
        <p class="intro" data-i18n="password.step2Intro">拿到管理员给你的秘钥后，在这里输入账号、秘钥和新密码。秘钥自申请生成起 24 小时内有效，用过后立即失效。</p>
        <form class="form" id="resetForm">
          <div class="field">
            <label class="label" for="resetUsername" data-i18n="password.username">账号名</label>
            <input class="input" id="resetUsername" maxlength="40" required autocomplete="username">
          </div>
          <div class="field">
            <label class="label" for="resetSecret" data-i18n="password.secret">重置秘钥</label>
            <input class="input" id="resetSecret" maxlength="40" required placeholder="例如 ABCD-EFGH-JKLM-NPQR" autocomplete="one-time-code" data-i18n-placeholder="password.secretPlaceholder">
          </div>
          <div class="field">
            <label class="label" for="resetPassword" data-i18n="password.newPassword">新密码</label>
            <input class="input" id="resetPassword" type="password" minlength="6" required autocomplete="new-password">
          </div>
          <div class="field">
            <label class="label" for="resetPasswordConfirm" data-i18n="password.confirmPassword">确认新密码</label>
            <input class="input" id="resetPasswordConfirm" type="password" minlength="6" required autocomplete="new-password">
          </div>
          <button class="button" type="submit" data-i18n="password.confirmReset">确认重置</button>
        </form>
        <p class="message" id="resetMessage" role="status"></p>
        <div class="reset-success" id="resetSuccess" hidden>
          <strong><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span id="resetSuccessTitle"></span></strong>
          <span id="resetSuccessHint"></span>
          <a class="button" id="resetSuccessLogin" href="member-center.html"></a>
        </div>
      </div>
    </section>
    <p class="note" data-i18n="password.note">说明：系统不会保存、也不会向任何人展示明文密码。管理员只能生成重置秘钥，或直接帮你改成新密码。</p>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const $ = id => document.getElementById(id);

    // 页内新增文案（改密成功态）：在 i18n boot 之后并入词典（幂等），
    // 与 member-checkin 相同的约定：不在 parse 期 merge，避免绕过全局包回退。
    const PASSWORD_PAGE_DICT = {
      zh: { password: { resetSuccessTitle: '密码已重置', resetSuccessHint: '请使用新密码重新登录，之后即可正常访问社员功能。' } },
      en: { password: { resetSuccessTitle: 'Password updated', resetSuccessHint: 'Sign in again with your new password to access member features.' } }
    };
    function mergePasswordPageDict() {
      if (window.ClubI18n && typeof ClubI18n.mergeDict === 'function') ClubI18n.mergeDict(PASSWORD_PAGE_DICT);
    }
    document.addEventListener('DOMContentLoaded', mergePasswordPageDict);
    window.addEventListener('club:langchange', mergePasswordPageDict);

    function setMessage(node, text, type = '') {
      node.textContent = text;
      node.className = `message ${type}`;
    }

    async function callPublic(action, body = {}) {
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, ...body })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || ClubI18n.t('password.requestFailed'));
      return payload;
    }

    function showResetSuccess() {
      $('resetSuccessTitle').textContent = ClubI18n.t('password.resetSuccessTitle');
      $('resetSuccessHint').textContent = ClubI18n.t('password.resetSuccessHint');
      $('resetSuccessLogin').textContent = ClubI18n.t('common.loginCenter');
      $('resetSuccess').hidden = false;
    }

    $('requestForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      ClubCommon.setBusy(submitButton, true);
      setMessage($('requestMessage'), ClubI18n.t('password.submitting'));
      try {
        const payload = await callPublic('password_reset_request', {
          username: $('requestUsername').value.trim()
        });
        setMessage($('requestMessage'), payload.message || ClubI18n.t('password.requestOk'), 'success');
      } catch (error) {
        setMessage($('requestMessage'), error.message, 'error');
      } finally {
        ClubCommon.setBusy(submitButton, false);
      }
    });

    $('resetForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = $('resetPassword').value;
      const confirm = $('resetPasswordConfirm').value;
      if (password !== confirm) {
        setMessage($('resetMessage'), ClubI18n.t('password.mismatch'), 'error');
        return;
      }
      const submitButton = event.currentTarget.querySelector('button[type="submit"]');
      $('resetSuccess').hidden = true;
      ClubCommon.setBusy(submitButton, true);
      setMessage($('resetMessage'), ClubI18n.t('password.resetting'));
      try {
        const payload = await callPublic('password_reset_with_secret', {
          username: $('resetUsername').value.trim(),
          secret: $('resetSecret').value.trim(),
          password
        });
        setMessage($('resetMessage'), payload.message || ClubI18n.t('password.resetOk'), 'success');
        showResetSuccess();
        $('resetSecret').value = '';
        $('resetPassword').value = '';
        $('resetPasswordConfirm').value = '';
      } catch (error) {
        setMessage($('resetMessage'), error.message, 'error');
      } finally {
        ClubCommon.setBusy(submitButton, false);
      }
    });
  </script>
  <script src="club-shell.js?v=158d2108"></script>
</body>
</html>
