<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>社员留言箱 · 算法社</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="member-identity.js"></script>
  <style>
    :root{--bg:#040814;--panel:rgba(8,17,38,.82);--line:rgba(105,154,210,.24);--text:#edf7ff;--muted:#8fa8c4;--cyan:#00e5ff;--violet:#8a6cff;--danger:#ff6b86;--success:#72f3c2;--shadow:0 22px 60px rgba(0,0,0,.32)}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-width:320px;margin:0;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(138,108,255,.15),transparent 28%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:rgba(4,8,20,.82);backdrop-filter:blur(18px)}.topbar-inner{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,229,255,.7);border-radius:9px;color:var(--cyan);box-shadow:0 0 24px rgba(0,229,255,.18)}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.member-identity{display:none;margin-left:10px;padding:5px 9px;border:1px solid rgba(0,229,255,.34);border-radius:999px;color:var(--cyan);font-size:12px;white-space:nowrap}.member-identity:not([hidden]){display:inline-flex}.back{color:var(--muted);font-size:14px}.back:hover{color:var(--cyan)}main{max-width:1180px;margin:auto;padding:58px 22px 90px;position:relative;z-index:1}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:30px;align-items:end;margin-bottom:34px}.eyebrow{margin:0 0 14px;color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(42px,8vw,86px);line-height:.98;letter-spacing:0;text-shadow:0 0 30px rgba(0,229,255,.35)}.hero p{max-width:650px;color:var(--muted);font-size:17px;line-height:1.8}.status-panel,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.status-panel{padding:20px}.status-panel strong{display:block;color:var(--cyan);font-size:20px;margin-bottom:8px}.status-panel span{color:var(--muted);font-size:13px;line-height:1.7}.panel{padding:24px;margin-bottom:18px}.panel h2{margin:0 0 8px;font-size:22px}.panel-intro{margin:0;color:var(--muted);line-height:1.7}.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.button{border:1px solid rgba(0,229,255,.55);border-radius:8px;padding:11px 15px;color:var(--text);background:rgba(0,229,255,.12);cursor:pointer;font:inherit}.button:hover{background:rgba(0,229,255,.22)}.button.secondary{border-color:var(--line);background:transparent}.label{display:block;margin-bottom:7px;color:var(--muted);font-size:13px}.input{width:100%;padding:11px 12px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:rgba(2,7,18,.76);outline:none;font:inherit}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}textarea.input{min-height:126px;resize:vertical;line-height:1.65}.message-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:22px}.form-wide{grid-column:1/-1}.form-actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.message{min-height:24px;margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.message.error{color:var(--danger)}.message.success{color:var(--success)}.message-list{display:grid;gap:14px;margin-top:22px}.message-card{padding:18px;border:1px solid rgba(105,154,210,.18);border-radius:9px;background:rgba(2,7,18,.5)}.message-card-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}.message-card h3{margin:0;color:var(--text);font-size:17px}.message-card time,.message-card .class-name{color:var(--muted);font-size:13px;line-height:1.6}.message-card p{margin:13px 0 0;color:var(--text);line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.message-actions{display:flex;gap:7px;flex:0 0 auto}.row-button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);background:rgba(0,229,255,.06);cursor:pointer;font:inherit;font-size:12px}.row-button:hover{border-color:var(--cyan)}.row-button.delete{color:var(--danger);border-color:rgba(255,107,134,.4)}.empty{padding:42px 0;text-align:center;color:var(--muted)}.loading{color:var(--cyan)}.member-gate{display:none;min-height:240px;place-items:center;text-align:center}.member-gate.active{display:grid}.member-gate strong{display:block;color:var(--cyan);font-size:24px;margin-bottom:10px}.member-gate p{margin:0;color:var(--muted);line-height:1.8}.member-content.hidden{display:none}@media(max-width:760px){.hero{grid-template-columns:1fr;margin-bottom:22px}.topbar-inner{padding:13px 16px}main{padding:42px 16px 70px}.panel{padding:18px}.hero h1{letter-spacing:0}.message-form{grid-template-columns:1fr}.message-card-head{gap:8px}.message-actions{flex-wrap:wrap;justify-content:flex-end}}
  </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong>算法社</strong><small>Algorithm Club</small></span></a><span class="member-identity" data-member-identity hidden></span><a class="back" href="../index.html">返回官网</a></div></header>
<main>
  <section id="memberGate" class="panel member-gate"><div><strong>您还不是算法社社员！</strong><p>请先使用受邀请码邀请创建的社团盘账号登录。</p><p><a class="button secondary" href="member-center.html">前往个人中心登录</a></p></div></section>
  <div id="memberContent" class="member-content hidden">
    <section class="hero"><div><p class="eyebrow">MEMBER MESSAGE BOX</p><h1>社员留言箱</h1><p>记录社员的建议、想法与日常留言。全部内容仅对已登录的算法社成员开放。</p></div><div class="status-panel"><strong id="sessionStatus">社员已登录</strong><span id="sessionHint">你可以浏览留言并提交自己的内容。</span></div></section>
    <section class="panel"><div class="panel-head"><div><h2>留下留言</h2><p class="panel-intro">请留下姓名、班级和想说的话。</p></div></div><form id="messageForm" class="message-form"><div><label class="label" for="memberName">姓名</label><input class="input" id="memberName" type="text" required maxlength="40" autocomplete="name"></div><div><label class="label" for="memberClass">班级</label><input class="input" id="memberClass" type="text" required maxlength="40" placeholder="例如 高一（1）班"></div><div class="form-wide"><label class="label" for="messageContent">留言内容</label><textarea class="input" id="messageContent" required maxlength="1000" placeholder="写下你的建议或想法…"></textarea></div><div class="form-wide form-actions"><span class="message" id="formMessage" role="status"></span><button class="button" type="submit">提交留言</button></div></form></section>
    <section class="panel"><div class="panel-head"><div><h2>全部留言</h2><p class="panel-intro">按最新提交时间排序。</p></div><button id="refreshButton" class="button secondary" type="button">刷新留言</button></div><div id="messageList" class="message-list"><div class="empty loading">正在读取留言…</div></div><p id="listMessage" class="message" role="status"></p></section>
  </div>
</main>
<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),memberGate=document.getElementById('memberGate'),memberContent=document.getElementById('memberContent'),messageList=document.getElementById('messageList'),formMessage=document.getElementById('formMessage'),listMessage=document.getElementById('listMessage'),sessionStatus=document.getElementById('sessionStatus'),sessionHint=document.getElementById('sessionHint');let messages=[],isAdminMember=false;
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}function setMessage(node,text,type=''){node.textContent=text;node.className=`message ${type}`}function formatDate(value){const date=new Date(value);return Number.isNaN(date.valueOf())?'':date.toLocaleString('zh-CN',{dateStyle:'medium',timeStyle:'short'})}async function callMember(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error('您还不是算法社社员！');const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'留言箱操作失败。');return payload}
function renderMessages(){if(!messages.length){messageList.innerHTML='<div class="empty">暂时还没有留言。</div>';return}messageList.innerHTML=messages.map(item=>`<article class="message-card"><div class="message-card-head"><div><h3>${escapeHtml(item.member_name)}</h3><span class="class-name">${escapeHtml(item.member_class)}</span><time datetime="${escapeHtml(item.created_at)}"> · ${escapeHtml(formatDate(item.created_at))}</time></div>${isAdminMember?`<div class="message-actions"><button class="row-button message-edit" data-id="${escapeHtml(item.id)}" type="button">修改</button><button class="row-button delete message-delete" data-id="${escapeHtml(item.id)}" type="button">删除</button></div>`:''}</div><p>${escapeHtml(item.message_content)}</p></article>`).join('');if(isAdminMember){messageList.querySelectorAll('.message-edit').forEach(button=>button.onclick=()=>editMessage(button.dataset.id));messageList.querySelectorAll('.message-delete').forEach(button=>button.onclick=()=>deleteMessage(button.dataset.id))}}
async function refreshMessages(){try{const payload=await callMember('member_messages_list');messages=payload.messages||[];renderMessages();setMessage(listMessage,'')}catch(error){messageList.innerHTML='<div class="empty">暂时无法读取留言。</div>';setMessage(listMessage,error.message,'error')}}
async function editMessage(id){const item=messages.find(message=>message.id===id);if(!item)return;const memberName=prompt('姓名',item.member_name);if(memberName===null)return;const memberClass=prompt('班级',item.member_class);if(memberClass===null)return;const messageContent=prompt('留言内容',item.message_content);if(messageContent===null)return;try{await callMember('admin_member_messages_update',{id,memberName,memberClass,messageContent});setMessage(listMessage,'留言已修改。','success');await refreshMessages()}catch(error){setMessage(listMessage,error.message,'error')}}
async function deleteMessage(id){if(!confirm('确认删除这条留言吗？'))return;try{await callMember('admin_member_messages_delete',{id});setMessage(listMessage,'留言已删除。','success');await refreshMessages()}catch(error){setMessage(listMessage,error.message,'error')}}
let boundProfile=null;
function applyBoundProfile(){if(!boundProfile)return;const nameInput=document.getElementById('memberName'),classInput=document.getElementById('memberClass');if(boundProfile.member_name)nameInput.value=boundProfile.member_name;if(boundProfile.member_class)classInput.value=boundProfile.member_class}
async function loadBoundProfile(){try{const payload=await callMember('member_profile_get');boundProfile=payload?.bound?payload.profile:null;applyBoundProfile()}catch(_error){boundProfile=null}}
async function updateSession(session){const member=Boolean(session?.user?.id);memberGate.classList.toggle('active',!member);memberContent.classList.toggle('hidden',!member);if(!member){isAdminMember=false;return}const access=window.ClubStaffAccess?await window.ClubStaffAccess.fetchStaffAccess(session):{isSuperAdmin:false,permissions:{}};isAdminMember=Boolean(access.isSuperAdmin||access.permissions?.can_messages);sessionStatus.textContent=isAdminMember?'留言管理已启用':'成员已登录';sessionHint.textContent=isAdminMember?'你可以修改或删除任意留言。':'你可以浏览留言并提交自己的内容。';await loadBoundProfile();renderMessages()}
document.getElementById('refreshButton').onclick=refreshMessages;document.getElementById('messageForm').addEventListener('submit',async event=>{event.preventDefault();const memberName=document.getElementById('memberName').value,memberClass=document.getElementById('memberClass').value,messageContent=document.getElementById('messageContent').value;try{await callMember('member_messages_create',{memberName,memberClass,messageContent});event.target.reset();applyBoundProfile();setMessage(formMessage,'留言已提交。','success');await refreshMessages()}catch(error){setMessage(formMessage,error.message,'error')}});supabaseClient.auth.onAuthStateChange((_event,session)=>{void updateSession(session);if(session?.user?.id)void refreshMessages()});supabaseClient.auth.getSession().then(async({data:{session}})=>{await updateSession(session);if(session?.user?.id)await refreshMessages()});
</script>
</body>
</html>
