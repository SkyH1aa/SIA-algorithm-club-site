<!doctype html>
<html lang="zh-CN" data-i18n-title-key="pages.joinAdmin.title">
<head>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="club-ui.css">
  <script src="theme.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>报名管理 · 算法社</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="club-auth-storage.js"></script>
  <script src="member-identity.js" defer></script>
  <script src="i18n-dict.js"></script>
  <script src="i18n.js"></script>
<script src="service-prompts.js"></script><script src="service-gate.js"></script></head>
<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong data-i18n="common.brand">算法社</strong><small>Join Admin</small></span></a><span class="identity" data-member-identity hidden></span><a class="back" href="admin-hub.html" data-i18n="common.backAdmin">返回管理员总览</a></div></header>

  <div class="club-admin-rail" data-club-admin-rail aria-label="管理模块"></div><main>
    <section id="gate" class="panel gate"><div><strong data-i18n="common.loginFirst">请先登录</strong><p class="intro" data-i18n="admin.joinGateLead">报名管理需要对应权限。</p><a class="button" href="member-center.html" data-i18n="common.loginCenter">前往个人中心登录</a></div></section>
    <section id="denied" class="panel denied hidden"><div><strong data-i18n="admin.joinDenied">无报名管理权限</strong><p class="intro" data-i18n="admin.joinDeniedLead">请联系超管开通「报名管理」权限。</p></div></section>
    <div id="content" class="hidden">
      <p class="eyebrow">JOIN APPLICATIONS ADMIN</p>
      <h1 data-i18n="pages.joinAdmin.h1">报名管理</h1>
      <p class="lead" data-i18n="admin.joinLead">查看官网「立即加入」提交的报名信息。确认学生已加入或无需保留后，可直接删除对应记录。</p>

      <section class="panel">
        <div class="section-head">
          <div>
            <h2 data-i18n="admin.joinListTitle">报名列表</h2>
            <p class="intro" data-i18n="admin.joinListIntro">仅超管与拥有报名管理权限的账号可见。删除后不可恢复，请确认后再操作。</p>
          </div>
          <button class="button secondary" type="button" id="refreshApplications" data-i18n="admin.refreshList">刷新列表</button>
        </div>
        <div class="stats">
          <div class="stat"><strong id="statTotal">0</strong><span data-i18n="admin.joinTotal">报名总数</span></div>
        </div>
        <p class="message" id="joinAdminMessage" role="status"></p>
        <div class="table-wrap" id="applicationList"><div class="empty loading" data-i18n="admin.loadingJoin">正在读取报名列表…</div></div>
      </section>
    </div>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    const t = (key, vars) => (window.ClubI18n ? ClubI18n.t(key, vars) : key);
    const contactLabel = (type) => {
      const map = { wechat: 'admin.contactWechat', phone: 'admin.contactPhone', qq: 'admin.contactQq', email: 'admin.contactEmail' };
      return map[type] ? t(map[type]) : (type || '-');
    };
    let applicationsCache = [];
    let currentSession = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function formatTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('zh-CN', { hour12: false });
    }
    function setMessage(node, text, type = '') {
      node.textContent = text || '';
      node.className = `message ${type}`;
    }
    async function call(action, body = {}) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) throw new Error(t('admin.loginPlease'));
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          authorization: `Bearer ${session.access_token}`
        },
        body: JSON.stringify({ action, ...body })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(payload.error || t('admin.opFailed'));
      return payload;
    }

    function renderApplications(applications) {
      applicationsCache = applications;
      $('statTotal').textContent = String(applications.length);
      if (!applications.length) {
        $('applicationList').innerHTML = '<div class="empty">' + t('admin.emptyJoin') + '</div>';
        return;
      }
      $('applicationList').innerHTML = `<table class="table"><thead><tr><th>${t('admin.colName')}</th><th>${t('admin.colClass')}</th><th>${t('admin.colContact')}</th><th>${t('admin.colSelfIntro')}</th><th>${t('admin.colAttraction')}</th><th>${t('admin.colExpectation')}</th><th>${t('admin.colSubmittedAt')}</th><th>${t('admin.colActions')}</th></tr></thead><tbody>${applications.map(item => `
        <tr>
          <td><strong>${escapeHtml(item.chinese_name)}</strong></td>
          <td>${escapeHtml(item.member_class || '-')}</td>
          <td>
            <span class="badge">${escapeHtml(contactLabel(item.contact_type))}</span>
            <div class="muted-box" style="margin-top:6px">${escapeHtml(item.contact_value || '-')}</div>
          </td>
          <td><div class="muted-box">${escapeHtml(item.self_intro || '-')}</div></td>
          <td><div class="muted-box">${escapeHtml(item.attraction || '-')}</div></td>
          <td><div class="muted-box">${escapeHtml(item.expectation || '-')}</div></td>
          <td>${escapeHtml(formatTime(item.created_at))}</td>
          <td class="actions">
            <button class="button danger" type="button" data-delete-application="${escapeHtml(item.id)}" data-i18n="common.delete">删除</button>
          </td>
        </tr>
      `).join('')}</tbody></table>`;

      if (window.ClubI18n?.apply) ClubI18n.apply($('applicationList'));
      $('applicationList').querySelectorAll('[data-delete-application]').forEach(button => {
        button.addEventListener('click', async () => {
          const id = button.getAttribute('data-delete-application');
          const item = applicationsCache.find(row => row.id === id);
          if (!window.confirm(t('admin.confirmDeleteJoin', { name: item?.chinese_name || id }))) return;
          setMessage($('joinAdminMessage'), t('admin.deleting'));
          try {
            await call('admin_join_applications_delete', { id });
            setMessage($('joinAdminMessage'), t('admin.joinDeleted'), 'success');
            await refreshApplications();
          } catch (error) {
            setMessage($('joinAdminMessage'), error.message, 'error');
          }
        });
      });
    }

    async function refreshApplications() {
      $('applicationList').innerHTML = '<div class="empty loading">' + t('admin.loadingJoin') + '</div>';
      try {
        const payload = await call('admin_join_applications_list');
        renderApplications(payload.applications || []);
        setMessage($('joinAdminMessage'), '');
      } catch (error) {
        $('applicationList').innerHTML = '<div class="empty">' + t('admin.emptyJoinFail') + '</div>';
        setMessage($('joinAdminMessage'), error.message, 'error');
      }
    }

    async function updateView(session) {
      currentSession = session;
      const loggedIn = Boolean(session?.user?.id);
      $('gate').classList.toggle('hidden', loggedIn);
      if (!loggedIn) {
        $('denied').classList.add('hidden');
        $('content').classList.add('hidden');
        return;
      }
      const access = window.ClubStaffAccess
        ? await window.ClubStaffAccess.fetchStaffAccess(session)
        : { isSuperAdmin: false, permissions: {} };
      const allowed = Boolean(access.isSuperAdmin || access.permissions?.can_join);
      $('denied').classList.toggle('hidden', allowed);
      $('content').classList.toggle('hidden', !allowed);
      if (allowed) await refreshApplications();
    }

    $('refreshApplications').addEventListener('click', refreshApplications);
    supabaseClient.auth.onAuthStateChange((_event, session) => { void updateView(session); });
    supabaseClient.auth.getSession().then(({ data: { session } }) => updateView(session));

    window.addEventListener('club:langchange', () => {
      try {
        if (window.ClubI18n?.apply) ClubI18n.apply(document);
        if (typeof refreshApplications === 'function' && currentSession) void refreshApplications();
      } catch (_e) {}
    });
  </script>
  <script src="club-shell.js"></script>
</body>
</html>
