<script src="service-prompts.js?v=1cfff2ab"></script><script src="service-gate.js?v=6acc9c5f"></script>  <meta name="description" content="算法社官网：算法训练、可视化实验室、AI 五子棋与社团管理系统。">

<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span><strong data-i18n="common.brand">算法社</strong><small>Events & Notices</small></span></a><span class="identity" data-member-identity hidden></span><a class="back" href="../index.html" data-i18n="common.backSite">返回官网</a></div></header>
  <main>
    <p class="eyebrow">EVENTS & NOTICES</p>
    <h1 data-i18n="pages.events.h1">活动与公告</h1>
    <p class="lead" data-i18n="events.lead">查看社团通知、课程安排、比赛信息与活动报名。登录后可直接报名；管理员可在活动管理后台发布和修改内容。</p>
    <section class="layout">
      <div class="panel"><h2 data-i18n="events.announcements">最新公告</h2><p class="intro" data-i18n="events.announcementsIntro">置顶公告会优先显示，包含社团通知、课程安排和比赛信息。</p><div class="list" id="announcementList"><div class="empty loading" data-i18n="events.loadingAnnouncements">正在读取公告…</div></div></div>
      <div class="panel"><div class="events-panel-head"><div><h2 data-i18n="events.signup">活动报名</h2><p class="intro" data-i18n="events.signupIntro">查看活动状态、截止时间，并提交报名。</p></div><div class="events-view-toggle" role="tablist"><button type="button" class="chip is-active" data-events-view="list" role="tab" aria-selected="true" data-i18n="events.viewList">列表</button><button type="button" class="chip" data-events-view="calendar" role="tab" aria-selected="false" data-i18n="events.viewCalendar">日历</button></div></div><div class="list" id="eventList"><div class="empty loading" data-i18n="events.loadingEvents">正在读取活动…</div></div><div id="eventCalendar" class="event-calendar" hidden></div><p class="message" id="pageMessage" role="status"></p></div>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const $ = id => document.getElementById(id);
    let currentSession = null;
    let boundProfile = null;

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }
    function formatTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('zh-CN', { hour12: false });
    }
    function setMessage(text, type = '') {
      $('pageMessage').textContent = text;
      $('pageMessage').className = `message ${type}`;
    }
    async function call(action, body = {}, auth = false) {
      const headers = { 'content-type': 'application/json' };
      if (auth) {
        if (!currentSession?.access_token) throw new Error(ClubI18n.t('events.loginRequired'));
        headers.authorization = `Bearer ${currentSession.access_token}`;
      }
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers,
        body: JSON.stringify({ action, ...body })
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) throw ClubCommon.handleAuthError(response, payload, ClubI18n.t('events.requestFailed'));
      return payload;
    }

    function renderAnnouncements(items) {
      if (!items.length) {
        $('announcementList').innerHTML = '<div class="empty">' + ClubI18n.t('events.emptyAnnouncements') + '</div>';
        return;
      }
      $('announcementList').innerHTML = items.map(item => `
        <article class="card">
          <strong>${escapeHtml(item.title)}</strong>
          <div class="meta">
            <span class="badge cyan">${escapeHtml(item.category || ClubI18n.t('events.defaultCategoryAnn'))}</span>
            ${item.is_pinned ? '<span class="badge green">' + ClubI18n.t('events.pinned') + '</span>' : ''}
            <span class="badge">${ClubI18n.t('events.updated', { time: escapeHtml(formatTime(item.updated_at)) })}</span>
          </div>
          <p>${escapeHtml(item.content)}</p>
        </article>
      `).join('');
    }

    let eventsCache = [];
    let eventsView = 'list';
    let calendarMonth = null;

    function eventDay(item) {
      const raw = item.starts_at || item.signup_deadline || item.ends_at;
      if (!raw) return '';
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? '' : date.toISOString().slice(0, 10);
    }

    function renderCalendar(items) {
      const host = $('eventCalendar');
      const days = new Map();
      for (const item of items) {
        const day = eventDay(item);
        if (!day) continue;
        if (!days.has(day)) days.set(day, []);
        days.get(day).push(item);
      }
      if (!calendarMonth) {
        const first = [...days.keys()].sort()[0];
        const base = first ? new Date(first + 'T00:00:00') : new Date();
        calendarMonth = new Date(base.getFullYear(), base.getMonth(), 1);
      }
      const year = calendarMonth.getFullYear();
      const month = calendarMonth.getMonth();
      const firstWeekday = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const en = ClubI18n.getLang() === 'en';
      const monthLabel = en
        ? calendarMonth.toLocaleDateString('en-US', { year: 'numeric', month: 'long' })
        : `${year} 年 ${month + 1} 月`;
      const weekdays = en ? ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] : ['日','一','二','三','四','五','六'];
      const cells = [];
      for (let i = 0; i < firstWeekday; i += 1) cells.push('<span class="event-calendar-day is-empty"></span>');
      for (let day = 1; day <= daysInMonth; day += 1) {
        const key = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const list = days.get(key) || [];
        cells.push(`<div class="event-calendar-day${list.length ? ' has-events' : ''}">
          <span class="event-calendar-date">${day}</span>
          ${list.map(item => `<a class="event-calendar-item" href="#events" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</a>`).join('')}
        </div>`);
      }
      host.innerHTML = `
        <div class="event-calendar-head">
          <button type="button" class="button secondary" data-calendar-nav="-1" aria-label="${escapeHtml(en ? 'Previous month' : '上个月')}">‹</button>
          <strong>${escapeHtml(monthLabel)}</strong>
          <button type="button" class="button secondary" data-calendar-nav="1" aria-label="${escapeHtml(en ? 'Next month' : '下个月')}">›</button>
        </div>
        <div class="event-calendar-grid">
          ${weekdays.map(day => `<span class="event-calendar-weekday">${day}</span>`).join('')}
          ${cells.join('')}
        </div>`;
      host.querySelectorAll('[data-calendar-nav]').forEach(button => {
        button.addEventListener('click', () => {
          calendarMonth = new Date(year, month + Number(button.dataset.calendarNav), 1);
          renderCalendar(eventsCache);
        });
      });
    }

    function applyEventsView() {
      $('eventList').hidden = eventsView !== 'list';
      $('eventCalendar').hidden = eventsView !== 'calendar';
      document.querySelectorAll('[data-events-view]').forEach(button => {
        const active = button.dataset.eventsView === eventsView;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      if (eventsView === 'calendar') renderCalendar(eventsCache);
    }

    function renderEvents(items) {
      eventsCache = Array.isArray(items) ? items : [];
      if (!eventsCache.length) {
        $('eventList').innerHTML = '<div class="empty">' + ClubI18n.t('events.emptyEvents') + '</div>';
        $('eventCalendar').innerHTML = '<div class="empty">' + ClubI18n.t('events.emptyEvents') + '</div>';
        return;
      }
      if (eventsView === 'calendar') { applyEventsView(); return; }
      $('eventList').innerHTML = items.map(item => `
        <article class="card" data-event-id="${escapeHtml(item.id)}">
          <strong>${escapeHtml(item.title)}</strong>
          <div class="meta">
            <span class="badge cyan">${escapeHtml(item.category || ClubI18n.t('events.defaultCategoryEvt'))}</span>
            <span class="badge green">${escapeHtml(item.status || '-')}</span>
            ${item.is_featured ? '<span class="badge">' + ClubI18n.t('events.featured') + '</span>' : ''}
          </div>
          <p>${escapeHtml(item.summary || item.content || ClubI18n.t('events.noSummary'))}</p>
          <div class="meta" style="margin-top:10px">
            <span class="badge">${ClubI18n.t('events.location', { value: escapeHtml(item.location || '-') })}</span>
            <span class="badge">${ClubI18n.t('events.starts', { time: escapeHtml(formatTime(item.starts_at)) })}</span>
            <span class="badge">${ClubI18n.t('events.deadline', { time: escapeHtml(formatTime(item.signup_deadline)) })}</span>
          </div>
          ${item.allow_signup ? `
            <form class="form signup-form">
              <label class="label">${ClubI18n.t('events.name')}</label>
              <input class="input" name="memberName" required value="${escapeHtml(boundProfile?.member_name || '')}">
              <label class="label">${ClubI18n.t('events.className')}</label>
              <input class="input" name="memberClass" value="${escapeHtml(boundProfile?.member_class || '')}">
              <label class="label">${ClubI18n.t('events.contactOptional')}</label>
              <input class="input" name="contact" placeholder="${ClubI18n.t('events.contactPlaceholder')}">
              <label class="label">${ClubI18n.t('events.noteOptional')}</label>
              <textarea class="textarea" name="note" placeholder="${ClubI18n.t('events.notePlaceholder')}"></textarea>
              <div class="actions"><button class="button" type="submit">${ClubI18n.t('events.submitSignup')}</button></div>
            </form>
          ` : '<p class="message">' + ClubI18n.t('events.signupClosed') + '</p>'}
        </article>
      `).join('');

      $('eventList').querySelectorAll('.signup-form').forEach(form => {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const card = form.closest('[data-event-id]');
          const data = new FormData(form);
          setMessage(ClubI18n.t('events.submitting'));
          try {
            await call('event_signup', {
              eventId: card.getAttribute('data-event-id'),
              memberName: data.get('memberName'),
              memberClass: data.get('memberClass'),
              contact: data.get('contact'),
              note: data.get('note')
            }, true);
            setMessage(ClubI18n.t('events.signupOk'), 'success');
          } catch (error) {
            setMessage(error.message, 'error');
          }
        });
      });
    }

    async function loadBoundProfile() {
      if (!currentSession) {
        boundProfile = null;
        return;
      }
      try {
        const payload = await call('member_profile_get', {}, true);
        boundProfile = payload?.profile || payload || null;
      } catch (_) {
        boundProfile = null;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-events-view]').forEach(button => {
        button.addEventListener('click', () => {
          eventsView = button.dataset.eventsView === 'calendar' ? 'calendar' : 'list';
          applyEventsView();
        });
      });
    });

    async function refresh() {
      setMessage('');
      try {
        const [announcementsPayload, eventsPayload] = await Promise.all([
          call('announcements_list'),
          call('events_list')
        ]);
        await loadBoundProfile();
        renderAnnouncements(Array.isArray(announcementsPayload.announcements) ? announcementsPayload.announcements : []);
        renderEvents(Array.isArray(eventsPayload.events) ? eventsPayload.events : []);
      } catch (error) {
        $('announcementList').innerHTML = '<div class="empty">' + ClubI18n.t('events.failAnnouncements') + '</div>';
        $('eventList').innerHTML = '<div class="empty">' + ClubI18n.t('events.failEvents') + '</div>';
        setMessage(error.message, 'error');
      }
    }

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      currentSession = session;
      void refresh();
    });
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      currentSession = session;
      void refresh();
    });
    window.addEventListener('club:langchange', () => { void refresh(); });
  </script>
  <script src="club-shell.js?v=6f76acb2"></script>
</body>
</html>
