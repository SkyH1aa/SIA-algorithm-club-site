<!doctype html>
<html lang="zh-CN" data-i18n-title-key="pages.changelog.title">
<head>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="club-ui.css?v=2f4bee9c">
  <script src="theme.js?v=0efca64b"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>更新维护日志 · 算法社</title>
  <script src="i18n-dict.js?v=21e9f61d"></script><script src="member-identity.js?v=0af7f540"></script>

  <script src="i18n.js?v=eda11d20"></script><script src="club-common.js?v=b56b9c0f"></script>
<script src="service-prompts.js?v=1cfff2ab"></script><script src="service-gate.js?v=b53797fa"></script></head>
<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong data-i18n="common.brand">算法社</strong><small>Changelog</small></span></a><span class="identity" data-member-identity hidden></span><a class="back" href="../index.html" data-i18n="common.backSite">返回官网</a></div></header>
  <main>
    <p class="eyebrow">SITE CHANGELOG</p>
    <h1 data-i18n="pages.changelog.h1">更新维护日志</h1>
    <p class="lead" data-i18n="changelog.lead">记录算法社官网的功能更新与维护内容，对所有访客开放。</p>
    <section id="logList" class="timeline"><div class="panel empty loading" data-i18n="changelog.loading">正在读取更新日志…</div></section>
  </main>
  <script>
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    }

    async function loadChangelog() {
      const list = document.getElementById('logList');
      try {
        const response = await fetch('data/changelog.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(ClubI18n.t('changelog.loadFail'));
        const entries = await response.json();
        if (!Array.isArray(entries) || !entries.length) {
          list.innerHTML = '<div class="panel empty">' + ClubI18n.t('changelog.empty') + '</div>';
          return;
        }
        list.innerHTML = entries.map(entry => {
          const english = ClubI18n.getLang?.() === 'en';
          const title = english && entry.enTitle ? entry.enTitle : (entry.titleKey ? ClubI18n.t(entry.titleKey) : entry.title);
          const keys = Array.isArray(entry.itemKeys) ? entry.itemKeys : [];
          const fallback = Array.isArray(entry.items) ? entry.items : [];
          const items = english && Array.isArray(entry.enItems) ? entry.enItems : (keys.length ? keys.map(key => ClubI18n.t(key)) : fallback);
          return `<article class="panel entry"><div class="entry-head"><strong class="date">${escapeHtml(entry.date || '')}</strong></div><h2>${escapeHtml(title || ClubI18n.t('changelog.unnamed'))}</h2><ul>${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul></article>`;
        }).join('');
      } catch (error) {
        list.innerHTML = `<div class="panel empty">${escapeHtml(error.message || ClubI18n.t('changelog.loadFail'))}</div>`;
      }
    }

    loadChangelog();
    window.addEventListener('club:langchange', () => { void loadChangelog(); });
  </script>
  <script src="club-shell.js?v=90975bc7"></script>
</body>
</html>
