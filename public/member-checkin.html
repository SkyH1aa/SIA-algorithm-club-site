<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>签到兑换 · 算法社</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="member-identity.js"></script>
  <style>
    :root{--bg:#040814;--panel:rgba(8,17,38,.86);--line:rgba(105,154,210,.25);--text:#edf7ff;--muted:#8fa8c4;--cyan:#00e5ff;--violet:#8a6cff;--green:#72f3c2;--danger:#ff7790}*{box-sizing:border-box}html{background:var(--bg)}body{min-width:320px;margin:0;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(138,108,255,.14),transparent 28%),var(--bg)}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:rgba(4,8,20,.86);backdrop-filter:blur(18px)}.topbar-inner{max-width:1120px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,229,255,.7);border-radius:9px;color:var(--cyan)}.brand strong,.brand small{display:block}.brand small{color:var(--muted);font-size:11px;letter-spacing:1px}.member-identity{display:none;margin-left:auto;padding:5px 9px;border:1px solid rgba(0,229,255,.34);border-radius:999px;color:var(--cyan);font-size:12px}.member-identity:not([hidden]){display:inline-flex}.back{color:var(--muted);font-size:14px}.back:hover{color:var(--cyan)}main{max-width:1120px;margin:auto;padding:58px 22px 90px}.hero{margin-bottom:30px}.eyebrow{margin:0 0 13px;color:var(--cyan);font-size:12px;letter-spacing:2px}.hero h1{margin:0;font-size:clamp(42px,8vw,76px);line-height:1;letter-spacing:-1px;text-shadow:0 0 28px rgba(0,229,255,.32)}.hero p{max-width:650px;color:var(--muted);line-height:1.8}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px}.panel{border:1px solid var(--line);border-radius:12px;padding:24px;background:var(--panel);box-shadow:0 22px 60px rgba(0,0,0,.26)}.panel h2{margin:0 0 8px;font-size:22px}.panel p{color:var(--muted);line-height:1.7}.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.panel-heading h2{margin:0}.refresh-button{padding:7px 10px;font-size:13px}.gate{display:none;min-height:300px;place-items:center;text-align:center}.gate.active{display:grid}.content.hidden{display:none}.input,.select{width:100%;padding:12px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:rgba(2,7,18,.8);font:inherit;outline:none}.input:focus,.select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}.field{margin-top:16px}.field label{display:block;margin-bottom:7px;color:var(--muted);font-size:13px}.button{border:1px solid rgba(0,229,255,.55);border-radius:8px;padding:11px 15px;color:var(--text);background:rgba(0,229,255,.12);cursor:pointer;font:inherit}.button:hover{background:rgba(0,229,255,.22)}.button.secondary{border-color:var(--line);background:transparent}.message{min-height:24px;margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.message.success{color:var(--green)}.message.error{color:var(--danger)}.admin{display:none;margin-top:18px}.admin.active{display:block}.admin-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.code-result{margin-top:16px;padding:16px;border:1px solid rgba(114,243,194,.38);border-radius:8px;background:rgba(114,243,194,.08)}.code-result strong{display:block;color:var(--green);font-size:25px;letter-spacing:3px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px}.table th,.table td{padding:10px 8px;border-bottom:1px solid rgba(105,154,210,.14);text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:500}.all-users{min-width:220px;white-space:normal}.user-use{padding:4px 0;border-bottom:1px solid rgba(105,154,210,.1);line-height:1.45}.user-use:last-child{border-bottom:0}.user-use time{display:block;color:var(--muted);font-size:12px}.empty{padding:26px 0;text-align:center;color:var(--muted)}@media(max-width:800px){.grid,.admin-grid{grid-template-columns:1fr}.topbar-inner{padding:13px 16px}main{padding:42px 16px 70px}.panel{padding:18px}.member-identity{margin-left:0}.hero h1{letter-spacing:0}}
  </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong>算法社</strong><small>Algorithm Club</small></span></a><span class="member-identity" data-member-identity hidden></span><a class="back" href="../index.html">返回官网</a></div></header>
<main>
  <section id="memberGate" class="panel gate"><div><h2>您还不是算法社社员！</h2><p>签到兑换仅面向已登录社团盘的社员开放。</p><p><a class="button secondary" href="member-center.html">前往个人中心登录</a></p></div></section>
  <div id="memberContent" class="content hidden">
    <section class="hero"><p class="eyebrow">MEMBER CHECK-IN</p><h1>签到兑换</h1><p>输入中文姓名后选择签到类型。积分兑换需要签到码；课程签到无需签到码，会提交给管理员审核。</p></section>
    <section class="grid"><section class="panel"><h2>发起签到</h2><form id="redeemForm"><div class="field"><label for="checkinType">签到类型</label><select class="select" id="checkinType"><option value="points">兑换积分</option><option value="course">课程签到</option></select></div><div class="field"><label for="memberName">中文姓名</label><input class="input" id="memberName" maxlength="20" required placeholder="请输入 2 到 20 个连续中文字符"></div><div class="field" id="codeField"><label for="checkinCode">签到码</label><input class="input" id="checkinCode" maxlength="20" required autocomplete="off" placeholder="例如 A2BC3D4E"></div><p><button class="button" id="submitCheckinButton" type="submit">兑换积分</button></p></form><p id="redeemMessage" class="message" role="status"></p></section><section class="panel"><h2>签到说明</h2><p>积分兑换会根据积分榜中的中文姓名自动增加积分；找不到唯一匹配时会进入待处理列表。</p><p>课程签到只记录姓名、提交时间和登录账号，由管理员确认后增加 2 分。</p></section></section>
    <section id="adminPanel" class="admin"><section class="panel"><h2>签到码管理</h2><p>仅管理员可生成签到码、查看使用记录和待处理姓名。</p><form id="codeForm" class="admin-grid"><div class="field"><label for="points">积分价值</label><input class="input" id="points" type="number" min="1" max="1000000" value="1" required></div><div class="field"><label for="usageMode">用量规则</label><select class="select" id="usageMode"><option value="global_once">全局仅可使用一次</option><option value="per_member_once">所有用户每人一次</option></select></div><div class="field"><label for="expiresAt">有效期</label><input class="input" id="expiresAt" type="datetime-local" required></div><div><button class="button" type="submit">生成签到码</button></div></form><div id="createdCode"></div><p id="adminMessage" class="message" role="status"></p></section><section class="panel"><div class="panel-heading"><h2>使用记录</h2><button class="button secondary refresh-button" id="refreshRecordsButton" type="button">刷新记录</button></div><div class="table-wrap" id="codeList"><div class="empty">正在加载…</div></div></section><section class="panel"><h2>待处理姓名</h2><div class="table-wrap" id="pendingList"><div class="empty">正在加载…</div></div></section><section class="panel"><div class="panel-heading"><h2>课程签到审核</h2><button class="button secondary refresh-button" id="refreshCourseButton" type="button">刷新课程签到</button></div><div class="table-wrap" id="courseList"><div class="empty">正在加载…</div></div></section></section>
  </div>
</main>
<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const gate=document.getElementById('memberGate'),content=document.getElementById('memberContent'),adminPanel=document.getElementById('adminPanel'),redeemMessage=document.getElementById('redeemMessage'),adminMessage=document.getElementById('adminMessage');
const checkinType=document.getElementById('checkinType'),codeField=document.getElementById('codeField'),checkinCode=document.getElementById('checkinCode'),submitCheckinButton=document.getElementById('submitCheckinButton');
function message(node,text,type=''){node.textContent=text;node.className=`message ${type}`}
function esc(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function formatDate(value){return new Date(value).toLocaleString('zh-CN',{hour12:false})}
async function call(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error('您还不是算法社社员！');const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||'请求失败。');return payload}
function updateCheckinType(){const course=checkinType.value==='course';codeField.hidden=course;checkinCode.required=!course;submitCheckinButton.textContent=course?'提交课程签到':'兑换积分';message(redeemMessage,'')}
function renderCodes(codes,uses){const usesByCode=new Map(codes.map(code=>[code.id,[]]));uses.forEach(item=>usesByCode.get(item.checkin_code_id)?.push(item));document.getElementById('codeList').innerHTML=!codes.length?'<div class="empty">还没有签到码。</div>':`<table class="table"><thead><tr><th>签到码</th><th>积分</th><th>规则</th><th>使用</th><th>有效期</th><th>使用用户</th></tr></thead><tbody>${codes.map(code=>{const items=usesByCode.get(code.id)||[],users=code.usage_mode==='per_member_once'?items.map(item=>`<div class="user-use"><strong>${esc(item.member_name)}</strong><time>${formatDate(item.used_at)}</time></div>`).join('')||'未使用':items[0]?`${esc(items[0].member_name)} · ${formatDate(items[0].used_at)}`:'未使用';return `<tr><td><strong>${esc(code.code)}</strong></td><td>${esc(code.points)}</td><td>${code.usage_mode==='global_once'?'全局一次':'每人一次'}</td><td>${esc(code.used_count)} 次</td><td>${formatDate(code.expires_at)}</td><td class="all-users">${users}</td></tr>`}).join('')}</tbody></table>`}
function renderPending(items){document.getElementById('pendingList').innerHTML=!items.length?'<div class="empty">没有待处理签到。</div>':`<table class="table"><thead><tr><th>姓名</th><th>签到码</th><th>积分</th><th>提交账号</th><th>时间</th><th>操作</th></tr></thead><tbody>${items.map(item=>`<tr><td>${esc(item.member_name)}</td><td>${esc(item.club_checkin_codes?.code)}</td><td>${esc(item.club_checkin_codes?.points)}</td><td>${esc(item.submitted_email)}</td><td>${formatDate(item.created_at)}</td><td><button class="button secondary resolve-pending" type="button" data-pending-id="${esc(item.id)}">已处理</button></td></tr>`).join('')}</tbody></table>`}
function renderCourse(items){document.getElementById('courseList').innerHTML=!items.length?'<div class="empty">没有待审核的课程签到。</div>':`<table class="table"><thead><tr><th>姓名</th><th>请求时间</th><th>登录账号</th><th>积分榜匹配</th><th>操作</th></tr></thead><tbody>${items.map(item=>{const unique=item.matching_count===1;const status=unique?'存在唯一对应':'不存在唯一对应';const action=unique?`<button class="button course-approve" type="button" data-course-id="${esc(item.id)}">确认签到</button>`:`<button class="button course-add" type="button" data-course-id="${esc(item.id)}">添加到积分榜</button>`;return `<tr><td>${esc(item.member_name)}</td><td>${formatDate(item.created_at)}</td><td>${esc(item.submitted_email)}</td><td>${status}（${esc(item.matching_count)} 条）</td><td>${action} <button class="button secondary course-reject" type="button" data-course-id="${esc(item.id)}">拒绝签到</button></td></tr>`}).join('')}</tbody></table>`}
async function refreshAdmin(){try{const [record,pending,course]=await Promise.all([call('admin_checkin_list'),call('admin_checkin_pending_list'),call('admin_course_checkin_list')]);renderCodes(record.codes||[],record.uses||[]);renderPending(pending.pending||[]);renderCourse(course.requests||[])}catch(error){message(adminMessage,error.message,'error')}}
let boundProfile=null;
async function loadBoundProfile(){try{const payload=await call('member_profile_get');boundProfile=payload?.bound?payload.profile:null;if(boundProfile?.member_name){const nameInput=document.getElementById('memberName');if(!nameInput.value.trim())nameInput.value=boundProfile.member_name}}catch(_error){boundProfile=null}}
async function updateSession(session){const member=Boolean(session?.user?.id);gate.classList.toggle('active',!member);content.classList.toggle('hidden',!member);if(!member){adminPanel.classList.remove('active');return}await loadBoundProfile();const access=window.ClubStaffAccess?await window.ClubStaffAccess.fetchStaffAccess(session):{isSuperAdmin:false,permissions:{}};const admin=Boolean(access.isSuperAdmin||access.permissions?.can_checkin);adminPanel.classList.toggle('active',admin);if(admin)await refreshAdmin()}
checkinType.addEventListener('change',updateCheckinType);
document.getElementById('refreshRecordsButton').addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='刷新中…';try{await refreshAdmin();message(adminMessage,'签到记录已刷新。','success')}finally{button.disabled=false;button.textContent='刷新记录'}});
document.getElementById('refreshCourseButton').addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='刷新中…';try{await refreshAdmin();message(adminMessage,'课程签到已刷新。','success')}finally{button.disabled=false;button.textContent='刷新课程签到'}});
document.getElementById('pendingList').addEventListener('click',async event=>{const button=event.target.closest('.resolve-pending');if(!button)return;button.disabled=true;button.textContent='处理中…';try{await call('admin_checkin_pending_resolve',{id:button.dataset.pendingId});await refreshAdmin();message(adminMessage,'待处理记录已删除。','success')}catch(error){message(adminMessage,error.message,'error');button.disabled=false;button.textContent='已处理'}});
document.getElementById('courseList').addEventListener('click',async event=>{const button=event.target.closest('button');if(!button)return;const id=button.dataset.courseId;button.disabled=true;try{if(button.classList.contains('course-approve')){await call('admin_course_checkin_approve',{id});message(adminMessage,'课程签到已确认，积分增加 2 分。','success')}else if(button.classList.contains('course-reject')){await call('admin_course_checkin_reject',{id});message(adminMessage,'课程签到申请已拒绝。','success')}else{const memberClass=prompt('请输入班级：','');if(memberClass===null){button.disabled=false;return}await call('admin_course_checkin_add_member',{id,memberClass});message(adminMessage,'已添加到积分榜，积分增加 2 分。','success')}await refreshAdmin()}catch(error){message(adminMessage,error.message,'error');button.disabled=false}});
document.getElementById('redeemForm').addEventListener('submit',async event=>{event.preventDefault();const memberName=document.getElementById('memberName').value;try{if(checkinType.value==='course'){await call('member_course_checkin',{memberName});message(redeemMessage,'课程签到已提交，请等待管理员审核。','success')}else{const result=(await call('member_checkin',{memberName,code:checkinCode.value})).result;if(result.status==='awarded')message(redeemMessage,`签到成功，已增加 ${result.points} 积分。`,'success');else message(redeemMessage,result.message||'签到已提交管理员处理。','success')}event.target.reset();updateCheckinType();if(boundProfile?.member_name)document.getElementById('memberName').value=boundProfile.member_name}catch(error){message(redeemMessage,error.message,'error')}});
document.getElementById('codeForm').addEventListener('submit',async event=>{event.preventDefault();try{const data=await call('admin_checkin_create',{points:Number(document.getElementById('points').value),usageMode:document.getElementById('usageMode').value,expiresAt:document.getElementById('expiresAt').value});const item=data.checkinCode;document.getElementById('createdCode').innerHTML=`<div class="code-result">新签到码<strong>${esc(item.code)}</strong><span>${item.points} 积分 · ${item.usage_mode==='global_once'?'全局一次':'每人一次'} · 至 ${formatDate(item.expires_at)}</span></div>`;message(adminMessage,'签到码已生成。','success');await refreshAdmin()}catch(error){message(adminMessage,error.message,'error')}});
updateCheckinType();supabaseClient.auth.onAuthStateChange((_event,session)=>void updateSession(session));supabaseClient.auth.getSession().then(({data:{session}})=>void updateSession(session));
</script>
</body>
</html>
