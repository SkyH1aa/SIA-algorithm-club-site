function createExtendedLevel(id,name,w,variant,settings={}){
  const terrain=[[0,520,w,80]];
  const layers=2+(variant%3);
  const layerY=[440,350,260,170];
  const layerStep=[760,820,880,920];
  const layerWidth=[520,500,460,430];
  for(let layer=0;layer<layers;layer++){
    const offset=(layer+1)*220+(variant%2?60:0);
    for(let x=offset;x<w-120;x+=layerStep[layer])terrain.push([x,layerY[layer],Math.min(layerWidth[layer],w-x-80),24]);
  }
  const laneY=[485,405,315,225,135].slice(0,layers+1);
  const p=[];
  const coinCount=settings.coinCount??25,beanCount=settings.beanCount??12;
  for(let i=0;i<coinCount;i++){
    const x=Math.round(120+(w-240)*(coinCount===1?0:i/(coinCount-1)));
    p.push(['coin',x,laneY[(i+variant)%laneY.length]]);
  }
  const addPickups=(type,count,phase)=>{
    for(let i=0;i<count;i++){
      const x=Math.round(120+(w-240)*(i+phase)/count);
      p.push([type,x,laneY[Math.floor(i+variant+phase)%laneY.length]]);
    }
  };
  addPickups('heart',beanCount,.18);
  addPickups('energy',beanCount,.46);
  addPickups('skill',beanCount,.74);
  const enemyCount=settings.enemyCount??(25+Math.floor((id-4)*30/8)),e=[];
  const enemyY=[480,400,310,220,130].slice(0,layers+1);
  for(let i=0;i<enemyCount;i++){
    const x=Math.round(420+(w-700)*(i+.5)/enemyCount);
    const type=['y','g','p'][(i+variant)%3];
    e.push([type,x,enemyY[(i+variant)%enemyY.length]]);
  }
  return {id,name,w,worldH:900,yScale:1.6,yBase:520,worldBase:820,terrain,e,p,f:w-140};
}

async function authenticate(action){
  const username=usernameInput.value.trim(),password=passwordInput.value;
  if(!/^[A-Za-z0-9_]{3,32}$/.test(username)){setAuthMessage('用户名需为 3-32 位字母、数字或下划线。',true);return}
  if(password.length<6){setAuthMessage('密码至少需要 6 位。',true);return}
  if(!platformerDb){setAuthMessage('Supabase 客户端未加载。',true);return}
  setAuthMessage(action==='login'?'正在登录…':'正在注册…');
  const rpc=action==='login'?'platformer_login':'platformer_register';
  const {data:result,error}=await platformerDb.rpc(rpc,{p_username:username,p_password:password});
  if(error||!result?.length){setAuthMessage(error?.message||'用户名或密码错误。',true);return}
  passwordInput.value='';localStorage.setItem('platformer-session',JSON.stringify({username:result[0].username,token:result[0].session_token}));startGame(result[0]);
}
async function resumeSession(){
  const saved=JSON.parse(localStorage.getItem('platformer-session')||'null');
  if(!saved||!platformerDb)return;
  const {data:result,error}=await platformerDb.rpc('platformer_resume',{p_username:saved.username,p_token:saved.token});
  if(error||!result?.length){localStorage.removeItem('platformer-session');return}
  startGame(result[0]);
}

}
async function submitScore(levelId,score){
  if(!platformerDb||!currentUser)return null;
  const {data:result,error}=await platformerDb.rpc('platformer_record_score',{p_username:currentUser.username,p_token:currentUser.token,p_level_id:levelId,p_score:score});
  if(error){console.warn('上传分数失败',error.message);return null}
  void loadLeaderboard();
  return result;
}
async function loadLeaderboard(){
  if(!platformerDb)return;
  const {data:rows,error}=await platformerDb.from('platformer_leaderboard').select('username,total_score').order('total_score',{ascending:false}).order('username').limit(20);
  if(error){leaderboardList.innerHTML='<li>排行榜将在执行 SQL 后可用。</li>';return}
  leaderboardList.innerHTML=rows.length?rows.map((row,index)=>`<li>${index+1}. ${escapeHtml(row.username)} <small>${row.total_score} 分</small></li>`).join(''):'<li>暂时没有通关成绩。</li>';
}
function escapeHtml(value){return String(value).replace(/[&<>'"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]))}

function updateJoystick(event){
  if(!joystick)return;
  const rect=joystick.getBoundingClientRect(),center=rect.left+rect.width/2;
  const delta=Math.max(-42,Math.min(42,event.clientX-center));
  touchMoveAxis=Math.abs(delta)<10?0:delta>0?1:-1;
  if(joystickKnob)joystickKnob.style.transform=`translateX(${delta}px)`;
}

class Game extends Phaser.Scene{

    this.energy=0;this.spreadShots=0;this.lastShot=-Infinity;this.shotDelay=Math.max(200,1000-Math.min(16,data.shot)*50);this.done=false;this.leftFace=false;this.heroJumping=false;this.heroKey='';

    this.aimLine=this.add.graphics().setDepth(8);

    (this.definition.tutorial||[]).forEach(([x,y,text])=>{

    });

  spawnEnemy([type,x,y]){
    y=this.worldY(y);
    const config=type==='y'?{body:'hitEnemy1',art:'enemy1',size:[72,42],flying:false}:type==='g'?{body:'hitEnemy2',art:'enemy2',size:[62,56],flying:false}:type==='b'?{body:'hitBoss3',art:'enemy3',size:[150,110],flying:true,boss:true}:{body:'hitEnemy3',art:'enemy3',size:[72,52],flying:true};

    enemy.art.setOrigin(.5,config.flying?.5:1);
    if(config.flying)enemy.body.allowGravity=false;
    enemy.setData('nextShot',this.time.now+(enemy.boss?3000:900+Math.random()*500));
    enemy.setData('nextSummon',this.time.now+10000);

  spawnItem([type,x,y]){
    y=this.worldY(y);
    const item=this.items.create(x,y,'hitItem').setVisible(false);
    item.type=type;item.art=this.add.image(x,y,type).setDisplaySize(32,32).setDepth(3);
    item.refreshBody();

  syncPlayerArt(force=false){
    const left=this.keys?this.keys.A.isDown||this.keys.LEFT.isDown||touchMoveAxis<0:false;
    const right=this.keys?this.keys.D.isDown||this.keys.RIGHT.isDown||touchMoveAxis>0:false;
    if(left)this.leftFace=true;else if(right)this.leftFace=false;
    const state=this.heroJumping?'heroJump':left||right?'heroMove':'heroStand';
    const key=state+(this.leftFace?'L':'R');
    if(force||key!==this.heroKey){this.playerArt.setTexture(key).setDisplaySize(52,78);this.heroKey=key;}
    this.playerArt.setPosition(this.player.x,this.player.body.bottom);
  }
  syncEnemyArt(enemy,force=false){
    const key=enemy.artBase+(enemy.facingLeft?'L':'R');
    if(force||enemy.artKey!==key){enemy.art.setTexture(key).setDisplaySize(enemy.artSize[0],enemy.artSize[1]);enemy.artKey=key;}
    if(enemy.flying)enemy.art.setPosition(enemy.x,enemy.y);else enemy.art.setPosition(enemy.x,enemy.body.bottom);
  }
  formatHealth(value){
    const rounded=Math.max(0,Math.round((Number(value)||0)*10)/10);
    return Number.isInteger(rounded)?String(rounded):rounded.toFixed(1);
  }
  updateNearestEnemyHealth(){
    let target=null,best=Infinity;
    this.enemies.getChildren().forEach(enemy=>{
      if(!enemy.active||enemy.getData('inView')===false)return;
      const dx=this.player.x-enemy.x,dy=this.player.y-enemy.y,distance=dx*dx+dy*dy;
      if(distance<best){best=distance;target=enemy;}
    });
    this.nearestEnemy=target;
    if(!target){this.enemyHpBar.clear();this.enemyHpText.setVisible(false);return;}
    const width=target.boss?170:92,height=8;
    const anchorY=target.flying?target.y-target.artSize[1]/2:target.body.top;
    const barX=target.x-width/2,barY=anchorY-18;
    const ratio=Phaser.Math.Clamp(target.hp/Math.max(1,target.maxHp),0,1);
    this.enemyHpBar.clear();
    this.enemyHpBar.fillStyle(0x111827,.9).fillRoundedRect(barX-2,barY-2,width+4,height+4,3);
    this.enemyHpBar.fillStyle(target.boss?0xff4d78:0x65e572,1).fillRoundedRect(barX,barY,width*ratio,height,2);
    this.enemyHpText.setPosition(target.x,barY-10).setText(`${this.formatHealth(target.hp)} / ${this.formatHealth(target.maxHp)}`).setVisible(true);
  }
  pickItem(player,item){
    const type=item.type;item.art.destroy();item.destroy();
    if(type==='coin'){this.coins++;this.score+=100}
    if(type==='energy')this.energy=Math.min(100,this.energy+35);
    if(type==='skill')this.spreadShots=3;
    if(type==='heart'){
      const healAmount=10+3*this.enemyMultiplier;
      this.hp=Math.min(this.maxHp,this.hp+healAmount);
    }

  touchEnemy(player,enemy){if(enemy.stunnedUntil>this.time.now)return;this.damage(enemy.contactDamage||1)}
  hitPlayer(player,bullet){const amount=bullet.getData('damage')||1;bullet.destroy();this.damage(amount)}
  damage(amount){
    if(this.invulnerable||this.done)return;
    const damageAmount=Math.max(0,Number(amount)||0);
    if(!damageAmount)return;
    this.hp=Phaser.Math.Clamp((Number(this.hp)||0)-damageAmount,0,this.maxHp);
    this.invulnerable=true;this.time.delayedCall(900,()=>this.invulnerable=false);
    if(this.hp<=0){this.hp=0;this.failLevel();}
  }
  checkEnemyContact(){
    if(this.done||this.invulnerable)return;
    this.enemies.getChildren().some(enemy=>{
      if(!enemy.active||enemy.stunnedUntil>this.time.now)return false;
      const playerBody=this.player.body,enemyBody=enemy.body;
      const overlap=playerBody.x<enemyBody.right&&playerBody.right>enemyBody.x&&playerBody.y<enemyBody.bottom&&playerBody.bottom>enemyBody.y;
      if(overlap){this.damage(enemy.contactDamage||1);return true;}
      return false;
    });
  }
  checkEnemyBulletContact(){
    if(this.done)return;
    const playerBody=this.player.body;
    this.enemyBullets.getChildren().forEach(bullet=>{
      if(!bullet.active||this.invulnerable)return;
      const body=bullet.body;
      const overlap=playerBody.x<body.right&&playerBody.right>body.x&&playerBody.y<body.bottom&&playerBody.bottom>body.y;
      if(overlap)this.hitPlayer(this.player,bullet);
    });
  }
  failLevel(){
    if(this.done)return;
    this.done=true;
    this.hp=0;
    const pickedCoins=this.coins;
    const reward=3;
    data.coins+=reward;
    save();
    this.scene.start('Result',{failed:true,score:this.score,coins:pickedCoins,reward});
  }
  hitEnemy(bullet,enemy){
    if(!enemy.active)return;
    const hitEnemies=bullet.getData('hitEnemies')||new Set();
    if(hitEnemies.has(enemy))return;
    hitEnemies.add(enemy);bullet.setData('hitEnemies',hitEnemies);
    enemy.hp-=(bullet.getData('damage')||this.atk);
    if(hitEnemies.size>=(bullet.getData('maxHits')||1))bullet.destroy();
    if(enemy.hp<=0){this.score+=175;enemy.art.destroy();enemy.destroy();}
  }
  toggleWeapon(){
    if(this.done)return;
    if(data.shot<35)return;
    const weapons=data.shot>=60?['pistol','smg','laser']:['pistol','smg'];
    const next=(weapons.indexOf(this.activeWeapon)+1)%weapons.length;
    this.activeWeapon=weapons[next];
    this.smgFiring=false;this.touchFiring=false;
    if(this.activeWeapon==='laser')this.startLaser(this.time.now);else this.laserLine.clear();
  }
  startLaser(time){
    if(this.activeWeapon!=='laser'||time<this.laserCooldownUntil||this.laserActiveUntil>time)return false;
    this.laserActiveUntil=time+this.laserDuration*1000;this.laserNextTick=time;return true;
  }
  findNearestEnemy(){
    let nearest=null,best=Infinity;
    this.enemies.getChildren().forEach(enemy=>{if(!enemy.active||enemy.getData('inView')===false)return;const d=Phaser.Math.Distance.Between(this.player.x,this.player.y,enemy.x,enemy.y);if(d<best){best=d;nearest=enemy;}});
    return nearest;
  }
  updateLaser(time){
    this.laserLine.clear();
    if(this.activeWeapon!=='laser')return;
    if(this.laserActiveUntil<=time){
      if(this.laserActiveUntil>0){this.laserCooldownUntil=Math.max(this.laserCooldownUntil,this.laserActiveUntil+this.laserCooldown*1000);this.laserActiveUntil=0;}
      if(time>=this.laserCooldownUntil)this.startLaser(time);
    }
    if(this.laserActiveUntil<=time)return;
    const target=this.findNearestEnemy();
    if(!target)return;
    this.laserLine.lineStyle(4,0xff4df3,.9).lineBetween(this.player.x,this.player.body.bottom-40,target.x,target.y);
    while(time>=this.laserNextTick&&this.laserNextTick<this.laserActiveUntil){
      target.hp-=this.laserDamage;this.laserNextTick+=200;
      if(target.hp<=0&&target.active){this.score+=175;target.art.destroy();target.destroy();break;}
    }
  }
  useDash(time){
    if(this.done||this.agilityLevel<1)return;
    this.rechargeDash(time);
    if(this.dashCharges<=0)return;
    const direction=this.leftFace?-1:1,startX=this.player.x,half=this.player.body.width/2;
    let targetX=startX+direction*this.dashDistance;
    this.platforms.getChildren().forEach(tile=>{
      if(!tile.getData('dashObstacle'))return;
      const body=tile.body;if(body.top>=this.player.body.bottom-8||body.bottom<=this.player.body.top+8)return;
      if(direction>0&&body.left>=startX-half&&body.left<=targetX+half)targetX=Math.min(targetX,body.left-half-1);
      if(direction<0&&body.right<=startX+half&&body.right>=targetX-half)targetX=Math.max(targetX,body.right+half+1);
    });
    const minX=this.player.body.width/2,maxX=this.definition.w-this.player.body.width/2;targetX=Phaser.Math.Clamp(targetX,minX,maxX);
    const left=Math.min(startX,targetX),right=Math.max(startX,targetX);let firstEnemy=null;
    if(this.agilityLevel>=20)this.enemies.getChildren().forEach(enemy=>{if(!enemy.active)return;const eb=enemy.body;if(eb.right>=left&&eb.left<=right&&eb.bottom>=this.player.body.top&&eb.top<=this.player.body.bottom){enemy.stunnedUntil=time+this.stunDuration*1000;if(!firstEnemy||Math.abs(enemy.x-startX)<Math.abs(firstEnemy.x-startX))firstEnemy=enemy;}});
    if(firstEnemy&&this.agilityLevel>=30){firstEnemy.hp-=20;if(firstEnemy.hp<=0){this.score+=175;firstEnemy.art.destroy();firstEnemy.destroy();}}
    this.player.x=targetX;this.player.setVelocityX(0);this.player.body.updateFromGameObject();
    this.dashCharges--;this.dashRechargeAt=time+this.dashCooldown*1000;
  }
  rechargeDash(time){
    if(this.dashCharges>=this.dashMaxCharges||!this.dashRechargeAt||time<this.dashRechargeAt)return;
    const elapsed=Math.floor((time-this.dashRechargeAt)/(this.dashCooldown*1000))+1;
    this.dashCharges=Math.min(this.dashMaxCharges,this.dashCharges+elapsed);
    this.dashRechargeAt=this.dashCharges<this.dashMaxCharges?this.dashRechargeAt+elapsed*this.dashCooldown*1000:0;
  }
  shoot(){
    if(this.done||this.activeWeapon==='laser')return;
    if(this.activeWeapon==='smg'){
      if(this.smgAmmo<=0)return;
    }else if(this.time.now-this.lastShot<this.shotDelay)return;
    if(this.activeWeapon==='pistol')this.lastShot=this.time.now;
    const pointer=this.pointer||this.input.activePointer;
    const target=this.cameras.main.getWorldPoint(pointer.x,pointer.y);
    const muzzleX=this.player.x+(this.leftFace?-10:10);
    const muzzleY=this.player.body.bottom-40;
    const base=Math.atan2(target.y-muzzleY,target.x-muzzleX);
    const count=this.activeWeapon==='smg'?1:this.spreadShots>0?6:this.pistolBurst;
    for(let index=0;index<count;index++){
      const angle=base+(index-(count-1)/2)*.14;
      const bullet=this.playerBullets.create(muzzleX+Math.cos(angle)*18,muzzleY+Math.sin(angle)*12,'bullet');
      bullet.setVelocity(Math.cos(angle)*720,Math.sin(angle)*720);bullet.body.allowGravity=false;bullet.setData('damage',this.activeWeapon==='smg'?1:this.atk);bullet.setData('maxHits',data.shot>=75?3:data.shot>=51?2:1);bullet.setData('hitEnemies',new Set());bullet.setData('expires',this.time.now+1200);
    }
    if(this.spreadShots>0)this.spreadShots--;
    if(this.activeWeapon==='smg')this.smgAmmo--;
  }
  useUltimate(){
    if(this.done||this.energy<100)return;
    this.energy=0;
    const muzzleX=this.player.x, muzzleY=this.player.body.bottom-40;
    for(let index=0;index<50;index++){
      const angle=index*Math.PI*2/50;
      const bullet=this.playerBullets.create(muzzleX+Math.cos(angle)*18,muzzleY+Math.sin(angle)*18,'bullet');
      bullet.setVelocity(Math.cos(angle)*520,Math.sin(angle)*520);bullet.body.allowGravity=false;bullet.setData('damage',this.atk);bullet.setData('maxHits',data.shot>=75?3:data.shot>=51?2:1);bullet.setData('hitEnemies',new Set());bullet.setData('expires',this.time.now+1500);
    }
  }
  updateEnemies(time){
    const view=this.cameras.main.worldView,viewMargin=96;
    this.enemies.getChildren().forEach(enemy=>{
      if(!enemy.active)return;
      const body=enemy.body;
      const inView=body.right>=view.x-viewMargin&&body.x<=view.right+viewMargin&&body.bottom>=view.y-viewMargin&&body.y<=view.bottom+viewMargin;
      enemy.setData('inView',inView);
      if(!inView){
        enemy.setVelocity(0,0);
        this.syncEnemyArt(enemy);
        return;
      }
      if(enemy.stunnedUntil>time){enemy.setVelocity(0,0);this.syncEnemyArt(enemy);return;}
      const dx=this.player.x-enemy.x,dy=this.player.y-enemy.y,distance=Math.hypot(dx,dy)||1,direction=Math.sign(dx)||1;
      if(enemy.type==='y')enemy.setVelocityX(direction*125);
      if(enemy.type==='g')enemy.setVelocityX(direction*52);
      if(enemy.type==='p'){enemy.setVelocityX(direction*42);enemy.setVelocityY((this.player.y-95-enemy.y)*1.35+Math.sin(time/380+enemy.x)*32);}
      if(enemy.type==='b'){enemy.setVelocityX(direction*18);enemy.setVelocityY((this.player.y-150-enemy.y)*.45+Math.sin(time/620+enemy.x)*18);}
      if(enemy.body.velocity.x<-1)enemy.facingLeft=true;
      if(enemy.body.velocity.x>1)enemy.facingLeft=false;
      this.syncEnemyArt(enemy);
      if(enemy.type==='b'){
        if(time>=enemy.getData('nextShot')){
          const phase=enemy.getData('patternPhase')||0;
          for(let index=0;index<20;index++){
            const angle=phase+index*Math.PI*2/20;
            const bullet=this.enemyBullets.create(enemy.x,enemy.y,'redBullet');
            bullet.setVelocity(Math.cos(angle)*250,Math.sin(angle)*250);bullet.body.allowGravity=false;bullet.setData('damage',this.enemyMultiplier*2);bullet.setData('expires',time+4200);
          }
          enemy.setData('patternPhase',phase+Math.PI/20);enemy.setData('nextShot',time+3000);
        }
        if(time>=enemy.getData('nextSummon')){
          const summonX=Phaser.Math.Clamp(enemy.x-120,120,this.definition.w-120);
          this.spawnEnemy(['p',summonX,300]);
          enemy.setData('nextSummon',time+10000);
        }
      }else if(enemy.type!=='y'&&time>=enemy.getData('nextShot')){
        const bullet=this.enemyBullets.create(enemy.x,enemy.y,enemy.type==='g'?'greenBullet':'redBullet');
        const speed=enemy.type==='g'?210:285;
        bullet.setVelocity(dx/distance*speed,dy/distance*speed);bullet.body.allowGravity=false;bullet.setData('damage',this.enemyMultiplier);bullet.setData('expires',time+3200);
        enemy.setData('nextShot',time+(enemy.type==='g'?1800:1350));
      }
    });
  }
  expireBullets(group,time){group.getChildren().forEach(bullet=>{if(bullet.active&&time>=bullet.getData('expires'))bullet.destroy()})}
  drawAimLine(){
    const pointer=this.pointer||this.input.activePointer,target=this.cameras.main.getWorldPoint(pointer.x,pointer.y);
    const angle=Math.atan2(target.y-this.player.y,target.x-this.player.x);
    this.aimLine.clear().lineStyle(2,0xffffff,.72);
    for(let distance=24;distance<180;distance+=18)this.aimLine.lineBetween(this.player.x+Math.cos(angle)*distance,this.player.y+Math.sin(angle)*distance,this.player.x+Math.cos(angle)*Math.min(distance+9,180),this.player.y+Math.sin(angle)*Math.min(distance+9,180));
  }
  update(time){
    const left=this.keys.A.isDown||this.keys.LEFT.isDown||touchMoveAxis<0,right=this.keys.D.isDown||this.keys.RIGHT.isDown||touchMoveAxis>0;
    this.player.setVelocityX(left?-230:right?230:0);
    const jumpPressed=Phaser.Input.Keyboard.JustDown(this.keys.W)||Phaser.Input.Keyboard.JustDown(this.keys.UP)||Phaser.Input.Keyboard.JustDown(this.keys.SPACE);
    if(jumpPressed&&this.player.body.blocked.down){this.player.setVelocityY(-590);this.heroJumping=true;}
    if(this.player.body.blocked.down&&this.player.body.velocity.y>=0)this.heroJumping=false;
    if(Phaser.Input.Keyboard.JustDown(this.keys.R))this.scene.restart();
    if(Phaser.Input.Keyboard.JustDown(this.keys.Z)&&this.energy>=100)this.useUltimate();
    if(Phaser.Input.Keyboard.JustDown(this.keys.S))this.useDash(time);
    this.rechargeDash(time);
    if((this.activeWeapon==='smg'&&this.smgFiring)||this.touchFiring)this.shoot();
    if(this.player.y>this.floorTop+130)this.failLevel();
    this.syncPlayerArt();
    this.updateEnemies(time);
    this.checkEnemyContact();
    this.checkEnemyBulletContact();
    this.updateLaser(time);
    this.updateNearestEnemyHealth();
    this.expireBullets(this.playerBullets,time);this.expireBullets(this.enemyBullets,time);
    this.drawAimLine();
    const weaponText=this.activeWeapon==='smg'?`冲锋枪 ${this.smgAmmo}发`:this.activeWeapon==='laser'?`激光枪 ${this.laserDamage.toFixed(1)}/0.2s ${this.laserActiveUntil>time?`运行 ${((this.laserActiveUntil-time)/1000).toFixed(1)}s`:`冷却 ${Math.max(0,(this.laserCooldownUntil-time)/1000).toFixed(1)}s`}`:`手枪 ${this.pistolBurst}连发 穿透 ${data.shot>=75?3:data.shot>=51?2:1}`;
    const dashText=this.agilityLevel?`闪身 ${this.dashCharges}/${this.dashMaxCharges}${this.dashCharges<this.dashMaxCharges?` (${Math.max(0,(this.dashRechargeAt-time)/1000).toFixed(1)}s)`:''}`:'闪身未解锁';
    const bossText=this.bossEnemy?.active?`   Boss HP ${Math.ceil(this.bossEnemy.hp)}`:'';
    this.hud.setText(`生命 ${this.formatHealth(this.hp)}/${this.formatHealth(this.maxHp)}   金币 ${this.coins}   得分 ${this.score}   能量 ${this.energy}%   散弹 ${this.spreadShots}/3   ${weaponText}   ${dashText}   射击冷却 ${(this.shotDelay/1000).toFixed(2)}s${bossText}`);
  }
  async finishLevel(){
    if(this.done)return;
    if(this.definition.boss&&this.bossEnemy?.active)return;
    this.done=true;
    const result=await submitScore(this.definition.id,this.score);
    const remoteFirst=result?.[0]?.is_first_completion;
    const first=typeof remoteFirst==='boolean'?remoteFirst:!data.claimed[this.definition.id];
    data.claimed[this.definition.id]=true;
    const reward=first?15+(this.definition.id-1)*10:5;
    data.coins+=this.coins+reward;
    if(level+1>=data.unlocked)data.unlocked=Math.min(LEVELS.length,level+2);
    save();this.scene.start('Result',{score:this.score,coins:this.coins,reward,first});
  }
}
class Result extends Phaser.Scene{
  constructor(){super('Result')}
  create(result){
    this.cameras.main.setBackgroundColor('#10182d');
    if(result?.failed){
      this.add.text(75,75,'游戏失败',{fontSize:'38px',color:'#ff8794'});
      this.add.text(80,145,`${LEVELS[level].name}\n\n生命值已归零，本局拾取的 ${result.coins||0} 金币已丢失。\n鼓励奖励：${result.reward??3} 金币`,{fontSize:'21px',color:'#fff'});
      const retry=this.add.text(80,350,'重新挑战',{fontSize:'20px',color:'#9fe8ff',backgroundColor:'#19334b',padding:{x:16,y:12}}).setInteractive({useHandCursor:true});
      retry.on('pointerdown',()=>this.scene.start('Game'));
      const home=this.add.text(80,425,'返回主页',{fontSize:'18px',color:'#f7fbff',backgroundColor:'#2c4050',padding:{x:16,y:10}}).setInteractive({useHandCursor:true});
      home.on('pointerdown',()=>this.scene.start('Menu'));
      return;
    }
    this.add.text(75,75,'关卡完成！',{fontSize:'38px',color:'#ffd166'});
    const rewardLabel=result.first===false?'重复挑战奖励':'首次通关奖励';
    this.add.text(80,145,`${LEVELS[level].name}\n\n得分：${result.score}\n本关拾取金币：${result.coins}\n${rewardLabel}：${result.reward??15} 金币`,{fontSize:'21px',color:'#fff'});
    const label=level+1<LEVELS.length?'继续下一关 →':'返回关卡选择 →';
    const button=this.add.text(80,350,label,{fontSize:'20px',color:'#9fe8ff',backgroundColor:'#19334b',padding:{x:16,y:12}}).setInteractive({useHandCursor:true});
    button.on('pointerdown',()=>{if(level+1<LEVELS.length){level++;this.scene.start('Game')}else this.scene.start('Menu')});
    const home=this.add.text(80,425,'返回主页',{fontSize:'18px',color:'#f7fbff',backgroundColor:'#2c4050',padding:{x:16,y:10}}).setInteractive({useHandCursor:true});
    home.on('pointerdown',()=>this.scene.start('Menu'));
  }
}
void resumeSession();
</script>
