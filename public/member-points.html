<main>
  <section id="memberGate" class="panel member-gate"><div><span class="gate-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg></span><h2 data-i18n="points.gateTitle">您还不是算法社社员！</h2><p data-i18n="points.gateHint">请先使用受邀请码邀请创建的社团盘账号登录。</p><p><a class="button secondary" href="member-center.html" data-i18n="common.loginCenter">前往个人中心登录</a></p></div></section>
  <div id="memberContent" class="member-content hidden">
    <section class="hero"><div><p class="eyebrow">MEMBER POINTS</p><h1 data-i18n="pages.points.h1">社员积分</h1><p data-i18n="points.lead">公示算法社成员的当前积分。积分按从高到低排列，数据更新后可即时刷新查看。</p></div><div class="status-panel"><strong id="sessionStatus" data-i18n="points.loggedIn">社员已登录</strong><span id="sessionHint" data-i18n="points.sessionHint">积分公示仅供社团成员查看。</span></div></section>
    <section class="panel"><div class="points-head"><div><h2 data-i18n="points.board">积分公示</h2><p class="panel-intro" data-i18n="points.boardIntro">社员名、班级与当前积分。</p></div><button class="button secondary" id="pointsRefreshButton" type="button" data-i18n="points.refreshBoard">刷新公示</button></div><div id="pointsList"><div class="club-skeleton-rows" aria-hidden="true"><div class="club-skeleton"></div><div class="club-skeleton"></div><div class="club-skeleton"></div><div class="club-skeleton"></div><div class="club-skeleton"></div></div><span class="club-sr-only" data-i18n="points.loading">正在读取积分公示…</span></div><p class="message" id="pointsMessage" role="status"></p></section>
    <section id="adminPanel" class="panel admin-panel"><div class="admin-head"><div><h2 data-i18n="points.adminTitle">积分管理</h2><p class="panel-intro" data-i18n="points.adminIntro">仅社长账号可添加、修改或删除积分记录。</p></div><button class="button secondary" id="adminRefreshButton" type="button" data-i18n="points.refreshPoints">刷新积分</button></div><form class="member-form" id="memberPointsForm"><input id="memberPointId" type="hidden"><div><label class="label" for="memberName" data-i18n="points.memberName">社员名</label><input class="input" id="memberName" required maxlength="40"></div><div><label class="label" for="memberClass" data-i18n="points.memberClass">社员班级</label><input class="input" id="memberClass" required maxlength="40" placeholder="例如 高一（1）班" data-i18n-placeholder="points.classPlaceholder"></div><div><label class="label" for="memberPoints" data-i18n="points.memberPoints">社员积分</label><input class="input" id="memberPoints" type="number" min="0" max="1000000" required></div><button class="button" id="memberPointsSaveButton" type="submit" data-i18n="common.save">保存</button><button class="button secondary" id="memberPointsCancelButton" type="button" data-i18n="points.cancelEdit">取消编辑</button></form><p class="message" id="adminMessage" role="status"></p><div id="memberPointsAdminList"></div></section>

<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const pointsList=document.getElementById('pointsList'),pointsMessage=document.getElementById('pointsMessage'),adminPanel=document.getElementById('adminPanel'),adminMessage=document.getElementById('adminMessage'),memberPointsAdminList=document.getElementById('memberPointsAdminList'),sessionStatus=document.getElementById('sessionStatus'),sessionHint=document.getElementById('sessionHint'),memberGate=document.getElementById('memberGate'),memberContent=document.getElementById('memberContent');let currentMembers=[];let sessionStatusKey='',sessionHintKey='';
// 页内新增文案（空态提示）：在 i18n boot 之后并入词典（幂等），与 member-checkin 相同约定。
const POINTS_PAGE_DICT={zh:{points:{emptyHint:'积分记录由管理员维护，登录后可在此查看完整公示。',emptyAdminHint:'使用上方表单添加第一条积分记录。'}},en:{points:{emptyHint:'Point records are maintained by admins. Sign in to view the full board.',emptyAdminHint:'Add the first record with the form above.'}}};
function mergePointsPageDict(){if(window.ClubI18n&&typeof ClubI18n.mergeDict==='function')ClubI18n.mergeDict(POINTS_PAGE_DICT)}
document.addEventListener('DOMContentLoaded',mergePointsPageDict);
function setMessage(node,text,type=''){node.textContent=text;node.className=`message ${type}`}function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function callPublic(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error(ClubI18n.t('points.notMember'));const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw ClubCommon.handleAuthError(response,payload,ClubI18n.t('points.failPublic'));return payload}async function callAdmin(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error(ClubI18n.t('points.adminLogin'));const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw ClubCommon.handleAuthError(response,payload,ClubI18n.t('points.adminFail'));return payload}
function renderPublicPoints(members){if(!members.length){pointsList.innerHTML='<div class="club-empty"><strong>'+ClubI18n.t('points.empty')+'</strong><span>'+ClubI18n.t('points.emptyHint')+'</span></div>';return}pointsList.innerHTML=`<div class="table-wrap"><table class="points-table"><thead><tr><th>${ClubI18n.t('points.colName')}</th><th>${ClubI18n.t('points.colClass')}</th><th>${ClubI18n.t('points.colPoints')}</th></tr></thead><tbody>${members.map(member=>`<tr><td><a class="member-profile-link" href="member-profile.html?id=${escapeHtml(member.id)}">${escapeHtml(member.member_name)}</a></td><td>${escapeHtml(member.member_class)}</td><td class="points-value">${escapeHtml(member.points)}</td></tr>`).join('')}</tbody></table></div>`}function renderAdminPoints(members){if(!members.length){memberPointsAdminList.innerHTML='<div class="club-empty"><strong>'+ClubI18n.t('points.empty')+'</strong><span>'+ClubI18n.t('points.emptyAdminHint')+'</span></div>';return}memberPointsAdminList.innerHTML=`<div class="table-wrap"><table class="points-table admin-points-table"><thead><tr><th>${ClubI18n.t('points.colName')}</th><th>${ClubI18n.t('points.colClass')}</th><th>${ClubI18n.t('points.colPoints')}</th><th>${ClubI18n.t('points.colAction')}</th></tr></thead><tbody>${members.map(member=>`<tr><td>${escapeHtml(member.member_name)}</td><td>${escapeHtml(member.member_class)}</td><td class="points-value">${escapeHtml(member.points)}</td><td><span class="member-row-actions"><button class="row-button member-edit" data-id="${escapeHtml(member.id)}" type="button">${ClubI18n.t('points.edit')}</button><button class="row-button delete member-delete" data-id="${escapeHtml(member.id)}" type="button" >${ClubI18n.t('common.delete')}</button></span></td></tr>`).join('')}</tbody></table></div>`;memberPointsAdminList.querySelectorAll('.member-edit').forEach(button=>button.onclick=()=>startEdit(button.dataset.id));memberPointsAdminList.querySelectorAll('.member-delete').forEach(button=>button.onclick=()=>deleteMember(button.dataset.id))}async function refreshMemberPoints(){try{const payload=await callPublic('member_points_list');currentMembers=payload.members||[];renderPublicPoints(currentMembers);if(adminPanel.classList.contains('active'))renderAdminPoints(currentMembers);setMessage(pointsMessage,'')}catch(error){pointsList.innerHTML='<div class="club-empty"><strong>'+ClubI18n.t('points.failList')+'</strong><span>'+escapeHtml(error.message)+'</span></div>';setMessage(pointsMessage,error.message,'error')}}
function resetForm(){document.getElementById('memberPointsForm').reset();document.getElementById('memberPointId').value='';const saveButton=document.getElementById('memberPointsSaveButton');delete saveButton.dataset.clubBusyText;saveButton.textContent=ClubI18n.t('common.save');setMessage(adminMessage,'')}function startEdit(id){const member=currentMembers.find(item=>item.id===id);if(!member)return;document.getElementById('memberPointId').value=member.id;document.getElementById('memberName').value=member.member_name;document.getElementById('memberClass').value=member.member_class;document.getElementById('memberPoints').value=member.points;document.getElementById('memberPointsSaveButton').textContent=ClubI18n.t('points.saveEdit');setMessage(adminMessage,ClubI18n.t('points.editing',{name:member.member_name}),'success')}async function deleteMember(id){if(!(await ClubCommon.confirm({ message: ClubI18n.t('points.confirmDelete') })))return;try{await callAdmin('admin_member_points_delete',{id});setMessage(adminMessage,ClubI18n.t('points.deleted'),'success');await refreshMemberPoints()}catch(error){setMessage(adminMessage,error.message,'error')}}async function updateSession(session){const member=Boolean(session?.user?.id);memberGate.classList.toggle('active',!member);memberContent.classList.toggle('hidden',!member);if(!member){adminPanel.classList.remove('active');sessionStatusKey='';sessionHintKey='';return}const access=window.ClubStaffAccess?await window.ClubStaffAccess.fetchStaffAccess(session):{isSuperAdmin:false,permissions:{}};const admin=Boolean(access.isSuperAdmin||access.permissions?.can_points);adminPanel.classList.toggle('active',admin);if(admin){sessionStatusKey='points.adminEnabled';sessionHintKey='points.adminHint';sessionStatus.textContent=ClubI18n.t(sessionStatusKey);sessionHint.textContent=ClubI18n.t(sessionHintKey);renderAdminPoints(currentMembers)}else{sessionStatusKey='points.memberLoggedIn';sessionHintKey='points.memberHint';sessionStatus.textContent=ClubI18n.t(sessionStatusKey);sessionHint.textContent=ClubI18n.t(sessionHintKey);renderPublicPoints(currentMembers)}}
document.getElementById('pointsRefreshButton').onclick=refreshMemberPoints;document.getElementById('adminRefreshButton').onclick=refreshMemberPoints;document.getElementById('memberPointsCancelButton').onclick=resetForm;document.getElementById('memberPointsForm').addEventListener('submit',async event=>{event.preventDefault();const saveButton=document.getElementById('memberPointsSaveButton');ClubCommon.setBusy(saveButton,true);try{const id=document.getElementById('memberPointId').value,memberName=document.getElementById('memberName').value,memberClass=document.getElementById('memberClass').value,points=Number(document.getElementById('memberPoints').value);await callAdmin('admin_member_points_save',{id,memberName,memberClass,points});setMessage(adminMessage,id?ClubI18n.t('points.updated'):ClubI18n.t('points.added'),'success');resetForm();await refreshMemberPoints()}catch(error){setMessage(adminMessage,error.message,'error')}finally{ClubCommon.setBusy(saveButton,false)}});supabaseClient.auth.onAuthStateChange((_event,session)=>{void updateSession(session);if(session?.user?.id)void refreshMemberPoints()});supabaseClient.auth.getSession().then(async({data:{session}})=>{await updateSession(session);if(session?.user?.id)await refreshMemberPoints()});
window.addEventListener('club:langchange',()=>{renderPublicPoints(currentMembers);if(adminPanel.classList.contains('active'))renderAdminPoints(currentMembers);if(sessionStatusKey){sessionStatus.textContent=ClubI18n.t(sessionStatusKey);sessionHint.textContent=ClubI18n.t(sessionHintKey)}if(window.ClubI18n)ClubI18n.apply(document);});
</script>
