<html lang="zh-CN" data-i18n-title-key="pages.points.title">

    <script src="i18n-dict.js"></script>
  <script src="i18n.js"></script>
<style>
    :root{--bg:#040814;--panel:rgba(8,17,38,.82);--line:rgba(105,154,210,.24);--text:#edf7ff;--muted:#8fa8c4;--cyan:#00e5ff;--violet:#8a6cff;--danger:#ff6b86;--shadow:0 22px 60px rgba(0,0,0,.32)}*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{min-width:320px;margin:0;color:var(--text);font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(0,229,255,.14),transparent 30%),radial-gradient(circle at 88% 18%,rgba(138,108,255,.15),transparent 28%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;background-image:linear-gradient(rgba(0,229,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.07) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}a{color:inherit;text-decoration:none}.topbar{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:rgba(4,8,20,.82);backdrop-filter:blur(18px)}.topbar-inner{max-width:1180px;margin:auto;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:10px}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(0,229,255,.7);border-radius:9px;color:var(--cyan);box-shadow:0 0 24px rgba(0,229,255,.18)}.brand strong{display:block}.brand small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;text-transform:uppercase}.member-identity{display:none;margin-left:10px;padding:5px 9px;border:1px solid rgba(0,229,255,.34);border-radius:999px;color:var(--cyan);font-size:12px;white-space:nowrap}.member-identity:not([hidden]){display:inline-flex}.back{color:var(--muted);font-size:14px}.back:hover{color:var(--cyan)}main{max-width:1180px;margin:auto;padding:58px 22px 90px;position:relative;z-index:1}.eyebrow{margin:0 0 14px;color:var(--cyan);font-size:12px;letter-spacing:2px;text-transform:uppercase}.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:30px;align-items:end;margin-bottom:34px}.hero h1{margin:0;font-size:clamp(42px,8vw,86px);line-height:.98;letter-spacing:-2px;text-shadow:0 0 30px rgba(0,229,255,.35)}.hero p{max-width:650px;color:var(--muted);font-size:17px;line-height:1.8}.status-panel,.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.status-panel{padding:20px}.status-panel strong{display:block;color:var(--cyan);font-size:20px;margin-bottom:8px}.status-panel span{color:var(--muted);font-size:13px;line-height:1.7}.panel{padding:24px;margin-bottom:18px}.panel h2{margin:0 0 8px;font-size:22px}.panel-intro{margin:0;color:var(--muted);line-height:1.7}.points-head,.admin-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.points-table{width:100%;border-collapse:collapse;margin-top:18px}.points-table th,.points-table td{padding:11px 8px;border-bottom:1px solid rgba(105,154,210,.14);text-align:left}.points-table th{color:var(--muted);font-size:13px;font-weight:500}.points-table td:last-child,.points-table th:last-child{text-align:right;font-variant-numeric:tabular-nums}.points-value{color:#72f3c2;font-weight:700}.button{border:1px solid rgba(0,229,255,.55);border-radius:8px;padding:11px 15px;color:var(--text);background:rgba(0,229,255,.12);cursor:pointer;font:inherit}.button:hover{background:rgba(0,229,255,.22)}.button.secondary{border-color:var(--line);background:transparent}.button.danger{border-color:rgba(255,107,134,.5);background:rgba(255,107,134,.1)}.label{color:var(--muted);font-size:13px}.input{width:100%;padding:11px 12px;color:var(--text);border:1px solid var(--line);border-radius:8px;background:rgba(2,7,18,.76);outline:none}.input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,229,255,.1)}.member-form{display:grid;grid-template-columns:minmax(120px,1fr) minmax(120px,1fr) minmax(100px,.6fr) auto auto;gap:10px;align-items:end;margin-top:24px}.member-row-actions{display:flex;justify-content:flex-end;gap:7px}.row-button{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--text);background:rgba(0,229,255,.06);cursor:pointer;font:inherit;font-size:12px}.row-button:hover{border-color:var(--cyan)}.row-button.delete{color:var(--danger)}.message{min-height:24px;margin:14px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.message.error{color:var(--danger)}.message.success{color:#72f3c2}.empty{padding:42px 0;text-align:center;color:var(--muted)}.loading{color:var(--cyan)}.admin-panel{display:none}.admin-panel.active{display:block}.member-gate{display:none;min-height:240px;place-items:center;text-align:center}.member-gate.active{display:grid}.member-gate strong{display:block;color:var(--cyan);font-size:24px;margin-bottom:10px}.member-gate p{margin:0;color:var(--muted);line-height:1.8}.member-content.hidden{display:none}@media(max-width:760px){.hero{grid-template-columns:1fr;margin-bottom:22px}.topbar-inner{padding:13px 16px}main{padding:42px 16px 70px}.panel{padding:18px}.hero h1{letter-spacing:-1px}.member-form{grid-template-columns:1fr}.points-table{font-size:14px}.points-table th,.points-table td{padding:10px 6px}.admin-points-table th:last-child,.admin-points-table td:last-child{width:118px}}
  </style>
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">S</span><span><strong data-i18n="common.brand">算法社</strong><small>Algorithm Club</small></span></a><span class="member-identity" data-member-identity hidden></span><a class="back" href="../index.html" data-i18n="common.backSite">返回官网</a></div></header>
<main>
  <section id="memberGate" class="panel member-gate"><div><strong data-i18n="points.gateTitle">您还不是算法社社员！</strong><p data-i18n="points.gateHint">请先使用受邀请码邀请创建的社团盘账号登录。</p><p><a class="button secondary" href="member-center.html" data-i18n="common.loginCenter">前往个人中心登录</a></p></div></section>
  <div id="memberContent" class="member-content hidden">
    <section class="hero"><div><p class="eyebrow">MEMBER POINTS</p><h1 data-i18n="pages.points.h1">社员积分</h1><p data-i18n="points.lead">公示算法社成员的当前积分。积分按从高到低排列，数据更新后可即时刷新查看。</p></div><div class="status-panel"><strong id="sessionStatus" data-i18n="points.loggedIn">社员已登录</strong><span id="sessionHint" data-i18n="points.sessionHint">积分公示仅供社团成员查看。</span></div></section>
    <section class="panel"><div class="points-head"><div><h2 data-i18n="points.board">积分公示</h2><p class="panel-intro" data-i18n="points.boardIntro">社员名、班级与当前积分。</p></div><button class="button secondary" id="pointsRefreshButton" type="button" data-i18n="points.refreshBoard">刷新公示</button></div><div id="pointsList"><div class="empty loading" data-i18n="points.loading">正在读取积分公示…</div></div><p class="message" id="pointsMessage" role="status"></p></section>
    <section id="adminPanel" class="panel admin-panel"><div class="admin-head"><div><h2 data-i18n="points.adminTitle">积分管理</h2><p class="panel-intro" data-i18n="points.adminIntro">仅社长账号可添加、修改或删除积分记录。</p></div><button class="button secondary" id="adminRefreshButton" type="button" data-i18n="points.refreshPoints">刷新积分</button></div><form class="member-form" id="memberPointsForm"><input id="memberPointId" type="hidden"><div><label class="label" for="memberName" data-i18n="points.memberName">社员名</label><input class="input" id="memberName" required maxlength="40"></div><div><label class="label" for="memberClass" data-i18n="points.memberClass">社员班级</label><input class="input" id="memberClass" required maxlength="40" placeholder="例如 高一（1）班" data-i18n-placeholder="points.classPlaceholder"></div><div><label class="label" for="memberPoints" data-i18n="points.memberPoints">社员积分</label><input class="input" id="memberPoints" type="number" min="0" max="1000000" required></div><button class="button" id="memberPointsSaveButton" type="submit" data-i18n="common.save">保存</button><button class="button secondary" id="memberPointsCancelButton" type="button" data-i18n="points.cancelEdit">取消编辑</button></form><p class="message" id="adminMessage" role="status"></p><div id="memberPointsAdminList"></div></section>
  </div>
</main>
<script>
const SUPABASE_URL='https://jgezpvmlnhycxslqbwcx.supabase.co',SUPABASE_KEY='sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl',supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),FUNCTION_URL=`${SUPABASE_URL}/functions/v1/club-drive`;
const pointsList=document.getElementById('pointsList'),pointsMessage=document.getElementById('pointsMessage'),adminPanel=document.getElementById('adminPanel'),adminMessage=document.getElementById('adminMessage'),memberPointsAdminList=document.getElementById('memberPointsAdminList'),sessionStatus=document.getElementById('sessionStatus'),sessionHint=document.getElementById('sessionHint'),memberGate=document.getElementById('memberGate'),memberContent=document.getElementById('memberContent');let currentMembers=[];
function setMessage(node,text,type=''){node.textContent=text;node.className=`message ${type}`}function escapeHtml(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function callPublic(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error(ClubI18n.t('points.notMember'));const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||ClubI18n.t('points.failPublic'));return payload}async function callAdmin(action,body={}){const {data:{session}}=await supabaseClient.auth.getSession();if(!session)throw new Error(ClubI18n.t('points.adminLogin'));const response=await fetch(FUNCTION_URL,{method:'POST',headers:{'content-type':'application/json',authorization:`Bearer ${session.access_token}`},body:JSON.stringify({action,...body})}),payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||ClubI18n.t('points.adminFail'));return payload}
function renderPublicPoints(members){if(!members.length){pointsList.innerHTML='<div class="empty">'+ClubI18n.t('points.empty')+'</div>';return}pointsList.innerHTML=`<table class="points-table"><thead><tr><th>${ClubI18n.t('points.colName')}</th><th>${ClubI18n.t('points.colClass')}</th><th>${ClubI18n.t('points.colPoints')}</th></tr></thead><tbody>${members.map(member=>`<tr><td>${escapeHtml(member.member_name)}</td><td>${escapeHtml(member.member_class)}</td><td class="points-value">${escapeHtml(member.points)}</td></tr>`).join('')}</tbody></table>`}function renderAdminPoints(members){if(!members.length){memberPointsAdminList.innerHTML='<div class="empty">'+ClubI18n.t('points.empty')+'</div>';return}memberPointsAdminList.innerHTML=`<table class="points-table admin-points-table"><thead><tr><th>${ClubI18n.t('points.colName')}</th><th>${ClubI18n.t('points.colClass')}</th><th>${ClubI18n.t('points.colPoints')}</th><th>${ClubI18n.t('points.colAction')}</th></tr></thead><tbody>${members.map(member=>`<tr><td>${escapeHtml(member.member_name)}</td><td>${escapeHtml(member.member_class)}</td><td class="points-value">${escapeHtml(member.points)}</td><td><span class="member-row-actions"><button class="row-button member-edit" data-id="${escapeHtml(member.id)}" type="button">${ClubI18n.t('points.edit')}</button><button class="row-button delete member-delete" data-id="${escapeHtml(member.id)}" type="button" >${ClubI18n.t('common.delete')}</button></span></td></tr>`).join('')}</tbody></table>`;memberPointsAdminList.querySelectorAll('.member-edit').forEach(button=>button.onclick=()=>startEdit(button.dataset.id));memberPointsAdminList.querySelectorAll('.member-delete').forEach(button=>button.onclick=()=>deleteMember(button.dataset.id))}async function refreshMemberPoints(){try{const payload=await callPublic('member_points_list');currentMembers=payload.members||[];renderPublicPoints(currentMembers);if(adminPanel.classList.contains('active'))renderAdminPoints(currentMembers);setMessage(pointsMessage,'')}catch(error){pointsList.innerHTML='<div class="empty">'+ClubI18n.t('points.failList')+'</div>';setMessage(pointsMessage,error.message,'error')}}
function resetForm(){document.getElementById('memberPointsForm').reset();document.getElementById('memberPointId').value='';document.getElementById('memberPointsSaveButton').textContent=ClubI18n.t('common.save');setMessage(adminMessage,'')}function startEdit(id){const member=currentMembers.find(item=>item.id===id);if(!member)return;document.getElementById('memberPointId').value=member.id;document.getElementById('memberName').value=member.member_name;document.getElementById('memberClass').value=member.member_class;document.getElementById('memberPoints').value=member.points;document.getElementById('memberPointsSaveButton').textContent=ClubI18n.t('points.saveEdit');setMessage(adminMessage,ClubI18n.t('points.editing',{name:member.member_name}),'success')}async function deleteMember(id){if(!confirm(ClubI18n.t('points.confirmDelete')))return;try{await callAdmin('admin_member_points_delete',{id});setMessage(adminMessage,ClubI18n.t('points.deleted'),'success');await refreshMemberPoints()}catch(error){setMessage(adminMessage,error.message,'error')}}async function updateSession(session){const member=Boolean(session?.user?.id);memberGate.classList.toggle('active',!member);memberContent.classList.toggle('hidden',!member);if(!member){adminPanel.classList.remove('active');return}const access=window.ClubStaffAccess?await window.ClubStaffAccess.fetchStaffAccess(session):{isSuperAdmin:false,permissions:{}};const admin=Boolean(access.isSuperAdmin||access.permissions?.can_points);adminPanel.classList.toggle('active',admin);if(admin){sessionStatus.textContent=ClubI18n.t('points.adminEnabled');sessionHint.textContent=ClubI18n.t('points.adminHint');renderAdminPoints(currentMembers)}else{sessionStatus.textContent=ClubI18n.t('points.memberLoggedIn');sessionHint.textContent=ClubI18n.t('points.memberHint');renderPublicPoints(currentMembers)}}
document.getElementById('pointsRefreshButton').onclick=refreshMemberPoints;document.getElementById('adminRefreshButton').onclick=refreshMemberPoints;document.getElementById('memberPointsCancelButton').onclick=resetForm;document.getElementById('memberPointsForm').addEventListener('submit',async event=>{event.preventDefault();try{const id=document.getElementById('memberPointId').value,memberName=document.getElementById('memberName').value,memberClass=document.getElementById('memberClass').value,points=Number(document.getElementById('memberPoints').value);await callAdmin('admin_member_points_save',{id,memberName,memberClass,points});setMessage(adminMessage,id?ClubI18n.t('points.updated'):ClubI18n.t('points.added'),'success');resetForm();await refreshMemberPoints()}catch(error){setMessage(adminMessage,error.message,'error')}});supabaseClient.auth.onAuthStateChange((_event,session)=>{void updateSession(session);if(session?.user?.id)void refreshMemberPoints()});supabaseClient.auth.getSession().then(async({data:{session}})=>{await updateSession(session);if(session?.user?.id)await refreshMemberPoints()});
window.addEventListener('club:langchange',()=>{renderPublicPoints(currentMembers);if(adminPanel.classList.contains('active'))renderAdminPoints(currentMembers);if(window.ClubI18n)ClubI18n.apply(document);});
</script>
</body>
</html>
