<!doctype html>
<html lang="zh-CN" data-i18n-title-key="chat.title"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 对话</title>
<link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="chat.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="theme.js"></script><script src="i18n-dict.js?v=20261016"></script><script src="i18n.js"></script><script src="chat-i18n.js"></script><script src="vendor/chat/marked.js"></script><script src="vendor/chat/purify.js"></script><script src="service-prompts.js"></script><script src="service-gate.js"></script><script type="module" src="chat.js"></script></head>
<body class="chat-page"><header class="chat-header"><a class="chat-back" href="member-center.html" data-i18n="chat.back">← 返回个人中心</a><h1 data-i18n="chat.title">AI 对话</h1><button id="language" type="button">EN / 中文</button></header>
<p id="gate" role="status"></p><div id="workspace" class="chat-layout" hidden><aside class="chat-sidebar"><button id="new" data-i18n="chat.new">新对话</button><nav id="conversations" aria-label="Conversations" data-i18n-aria="chat.conversations"></nav><button id="clear" data-i18n="chat.clear">清除此账号本地记录</button></aside>
<main class="chat-main"><div class="chat-settings"><label><span data-i18n="chat.model">模型</span><select id="model"></select></label><label><span data-i18n="chat.effort">思考强度</span><select id="effort"></select></label><span class="chat-budget" data-i18n="chat.outputManaged">最大输出 token 由管理员配置</span></div><div class="chat-tools"><button id="rename" data-i18n="chat.rename">重命名</button><button id="delete" data-i18n="chat.delete">删除对话</button><button id="export" data-i18n="chat.export">导出对话</button><button id="retry" data-i18n="chat.retry">重试 / 重新生成</button></div>
<div id="messages" aria-live="off"></div><form id="composer"><textarea id="prompt" rows="3" maxlength="500000" data-i18n-placeholder="chat.placeholder" aria-label="Message" data-i18n-aria="chat.message"></textarea><div id="attachments"></div><div class="chat-tools"><label class="chat-file"><span data-i18n="chat.attach">添加附件</span><input id="files" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.pdf,.txt,.md,.csv,.js,.ts,.jsx,.tsx,.py,.json,.html,.css,.c,.cpp,.h,.java,.rs,.go,.sql,.yaml,.yml,.xml,.sh,.log"></label><button id="send" type="submit" data-i18n="chat.send">发送</button><button id="stop" type="button" data-i18n="chat.stop" disabled>停止</button></div></form><p id="status" role="status"></p><p class="chat-note" data-i18n="chat.estimate"></p><details><summary data-i18n="chat.privacyTitle">本地存储、隐私与附件</summary><p data-i18n="chat.privacy"></p><p data-i18n="chat.limits"></p></details></main></div></body></html>
