<body class="club-page">
  <header class="topbar"><div class="topbar-inner"><a class="brand" href="../index.html"><span class="brand-mark">A</span><span><strong data-i18n="common.brand">算法社</strong><small>Join Application</small></span></a><span class="identity" data-member-identity hidden></span><a class="back" href="../index.html" data-i18n="common.backSite">返回官网</a></div></header>
  <main>
    <p class="eyebrow">JOIN THE CLUB</p>
    <h1 data-i18n="join.h1">加入算法社</h1>
    <p class="lead" data-i18n="join.lead">填写报名信息后提交即可。管理员会查看你的申请并尽快联系你。欢迎所有零基础选手加入！</p>
    <section class="layout">
      <aside class="panel">
        <h2 data-i18n="join.info">社团信息</h2>
        <p class="intro" data-i18n="join.infoIntro">先了解活动节奏与方向，再决定是否报名。</p>
        <ul class="info-list">
          <li><strong data-i18n="join.timeTitle">社团时间</strong><br><span data-i18n="join.timeBody">每周二和周四下午的 ECA 时间（15:45 到 17:10），一周出勤一天即可。</span></li>
          <li><strong data-i18n="join.teachTitle">主要教学</strong><br><span data-i18n="join.teachBody">C++ 和 Python，负责软件项目开发维护以及竞赛培训。</span></li>
        </ul>
        <div class="welcome" data-i18n="join.welcome">欢迎所有的零基础选手加入！</div>
      </aside>
      <section class="panel">
        <h2 data-i18n="join.form">报名表单</h2>
        <p class="intro" data-i18n="join.formIntro" data-i18n-mode="html">带 <span class="required">*</span> 的为必填项。联系方式请先选择类型，再填写对应号码 / 账号。</p>
        <form class="form" id="joinForm">
          <div class="grid-2">
            <div>
              <label class="label" for="chineseName"><span data-i18n="join.name">中文姓名*</span></label>
              <input class="input" id="chineseName" name="chineseName" maxlength="20" required placeholder="例如 张三" data-i18n-placeholder="join.namePlaceholder" pattern="[\u4e00-\u9fa5]{2,20}" autocomplete="name">
              <p class="hint" data-i18n="join.nameInvalid">请填写 2–20 个连续中文字符。</p>
            </div>
            <div>
              <label class="label" for="memberClass"><span data-i18n="join.className">班级*</span></label>
              <input class="input" id="memberClass" name="memberClass" maxlength="80" required placeholder="例如 A1C5 / 计科 2401" data-i18n-placeholder="join.classPlaceholder" autocomplete="organization-title">
            </div>
          </div>
          <div>
            <label class="label" for="contactType"><span data-i18n="join.contact">联系方式*</span></label>
            <div class="contact-row">
              <select class="select" id="contactType" name="contactType" required>
                <option value="wechat" data-i18n="join.wechat">微信号</option>
                <option value="phone" data-i18n="join.phone">手机号</option>
                <option value="qq" data-i18n="join.qq">QQ号</option>
                <option value="email" data-i18n="join.email">邮箱</option>
              </select>
              <input class="input" id="contactValue" name="contactValue" maxlength="120" required placeholder="请输入微信号" data-i18n-placeholder="join.contactValuePh">
            </div>
          </div>
          <div>
            <label class="label" for="selfIntro" data-i18n="join.selfIntro">介绍你自己（选填）</label>
            <textarea class="textarea" id="selfIntro" name="selfIntro" maxlength="500" placeholder="例如：兴趣方向、编程基础、是否参加过竞赛等" data-i18n-placeholder="join.selfIntroPh"></textarea>
          </div>
          <div>
            <label class="label" for="attraction" data-i18n="join.attraction">算法社什么吸引了你（选填）</label>
            <textarea class="textarea" id="attraction" name="attraction" maxlength="500" placeholder="例如：项目实践、竞赛培训、社团氛围等" data-i18n-placeholder="join.attractionPh"></textarea>
          </div>
          <div>
            <label class="label" for="expectation" data-i18n="join.expectation">你想在算法社获得什么（选填）</label>
            <textarea class="textarea" id="expectation" name="expectation" maxlength="500" placeholder="例如：学会一门语言、做出作品、参加比赛等" data-i18n-placeholder="join.expectationPh"></textarea>
          </div>
          <div class="actions">
            <button class="button" type="submit" id="submitButton" data-i18n="join.submit">提交报名</button>
            <button class="button secondary" type="reset" id="resetButton" data-i18n="common.clearForm">清空表单</button>
          </div>
        </form>
        <p class="message" id="joinMessage" role="status"></p>
      </section>
    </section>
  </main>
  <script>
    const SUPABASE_URL = 'https://jgezpvmlnhycxslqbwcx.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_B29ClgwZagW32Ow5x6VdKQ_IL65F7dl';
    const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/club-drive`;
    const $ = id => document.getElementById(id);
    const CONTACT_PLACEHOLDERS = () => ({
      wechat: ClubI18n.t('join.phWechat'),
      phone: ClubI18n.t('join.phPhone'),
      qq: ClubI18n.t('join.phQq'),
      email: ClubI18n.t('join.phEmail')
    });

    function setMessage(text, type = '') {
      $('joinMessage').textContent = text || '';
      $('joinMessage').className = `message ${type}`;
    }

    function syncContactPlaceholder() {
      const type = $('contactType').value;
      $('contactValue').placeholder = CONTACT_PLACEHOLDERS()[type] || ClubI18n.t('join.phContact');
    }

    async function submitJoin(payload) {
      const response = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action: 'join_application_create', ...payload })
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || ClubI18n.t('join.submitFail'));
      return result;
    }

    $('contactType').addEventListener('change', syncContactPlaceholder);
    syncContactPlaceholder();
    window.addEventListener('club:langchange', () => { syncContactPlaceholder(); if (window.ClubI18n) ClubI18n.apply(document); });

    $('joinForm').addEventListener('reset', () => {
      setTimeout(() => {
        syncContactPlaceholder();
        setMessage('');
      }, 0);
    });

    $('joinForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const chineseName = $('chineseName').value.trim();
      const memberClass = $('memberClass').value.trim();
      const contactType = $('contactType').value;
      const contactValue = $('contactValue').value.trim();
      if (!/^[\u4e00-\u9fa5]{2,20}$/.test(chineseName)) {
        setMessage(ClubI18n.t('join.nameInvalid'), 'error');
        return;
      }
      if (!memberClass) {
        setMessage(ClubI18n.t('join.classRequired'), 'error');
        return;
      }
      if (!contactValue) {
        setMessage(ClubI18n.t('join.contactRequired'), 'error');
        return;
      }
      $('submitButton').disabled = true;
      setMessage(ClubI18n.t('join.submitting'));
      try {
        const result = await submitJoin({
          chineseName,
          memberClass,
          contactType,
          contactValue,
          selfIntro: $('selfIntro').value.trim(),
          attraction: $('attraction').value.trim(),
          expectation: $('expectation').value.trim()
        });
        setMessage(result.message || ClubI18n.t('join.submitted'), 'success');
        $('joinForm').reset();
        syncContactPlaceholder();
      } catch (error) {
        setMessage(error.message || ClubI18n.t('join.failed'), 'error');
      } finally {
        $('submitButton').disabled = false;
      }
    });
  </script>
  <script src="club-shell.js?v=6f76acb2"></script>
</body>
</html>
